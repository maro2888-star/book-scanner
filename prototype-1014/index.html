<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>スマホde選書会 10/14試作版</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #f7f7f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0 6px;
      text-align: center;
      font-size: 21px;
    }

    .subtitle {
      margin-bottom: 14px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      height: 260px;
      overflow: hidden;
      background: #000;
      border-radius: 10px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 29%;
      height: 34%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      pointer-events: none;
    }

    .guide-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }

    .card {
      margin-top: 12px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 8px;
    }

    .center {
      text-align: center;
    }

    .label {
      margin-bottom: 6px;
      color: #666;
      font-size: 13px;
    }

    #result {
      min-height: 34px;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    #message {
      margin-top: 8px;
      min-height: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #146c2e;
    }

    .error {
      color: #b00020;
    }

    .book-row {
      margin: 10px 0;
    }

    .book-label {
      margin-bottom: 3px;
      color: #666;
      font-size: 12px;
    }

    .book-value {
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
    }

    .book-title {
      font-size: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #bookCard,
    #nextButton,
    #retryOpenBdButton {
      display: none;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>スマホde選書会</h1>

    <div class="subtitle">
      10/14試作版・OpenBD接続テスト
    </div>


    <div
      id="cameraWrap"
      class="camera-wrap"
    >

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-guide"></div>

      <div class="guide-label">
        1段目のバーコードをこの枠に合わせてください
      </div>

    </div>


    <section class="card center">

      <div class="label">
        読み取ったコード
      </div>

      <div id="result">
        まだありません
      </div>

      <div id="message">
        カメラを起動しています…
      </div>

    </section>


    <section
      id="bookCard"
      class="card"
    >

      <div class="book-row">
        <div class="book-label">
          書名
        </div>
        <div
          id="bookTitle"
          class="book-value book-title"
        ></div>
      </div>

      <div class="book-row">
        <div class="book-label">
          出版社
        </div>
        <div
          id="bookPublisher"
          class="book-value"
        ></div>
      </div>

      <div class="book-row">
        <div class="book-label">
          著者
        </div>
        <div
          id="bookAuthor"
          class="book-value"
        ></div>
      </div>

      <div class="book-row">
        <div class="book-label">
          ISBN
        </div>
        <div
          id="bookIsbn"
          class="book-value"
        ></div>
      </div>

    </section>


    <button
      id="retryCameraButton"
      type="button"
      style="display:none;"
    >
      カメラを再起動する
    </button>


    <button
      id="retryOpenBdButton"
      type="button"
    >
      書誌情報を再検索する
    </button>


    <button
      id="nextButton"
      type="button"
    >
      次の本を読み取る
    </button>


    <canvas id="canvas"></canvas>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/zxing-wasm/dist/iife/reader/index.js">
  </script>


  <script>
    "use strict";


    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    const cameraWrap =
      document.getElementById("cameraWrap");

    const resultElement =
      document.getElementById("result");

    const messageElement =
      document.getElementById("message");

    const bookCard =
      document.getElementById("bookCard");

    const bookTitle =
      document.getElementById("bookTitle");

    const bookPublisher =
      document.getElementById("bookPublisher");

    const bookAuthor =
      document.getElementById("bookAuthor");

    const bookIsbn =
      document.getElementById("bookIsbn");

    const retryCameraButton =
      document.getElementById("retryCameraButton");

    const retryOpenBdButton =
      document.getElementById("retryOpenBdButton");

    const nextButton =
      document.getElementById("nextButton");


    let stream = null;
    let scanning = false;
    let decoding = false;
    let animationId = null;
    let lastDecodeTime = 0;

    let currentIsbn = "";

    const DECODE_INTERVAL = 120;


    function normalizeCode(text) {

      return String(text || "")
        .replace(/\D/g, "");
    }


    function isIsbn(code) {

      return (
        /^\d{13}$/.test(code) &&
        (
          code.startsWith("978") ||
          code.startsWith("979")
        )
      );
    }


    function isSecondBarcode(code) {

      return (
        /^\d{13}$/.test(code) &&
        code.startsWith("192")
      );
    }


    function setMessage(
      text,
      className = ""
    ) {

      messageElement.textContent =
        text;

      messageElement.className =
        className;
    }


    function clearBookDisplay() {

      bookCard.style.display =
        "none";

      bookTitle.textContent = "";
      bookPublisher.textContent = "";
      bookAuthor.textContent = "";
      bookIsbn.textContent = "";

      retryOpenBdButton.style.display =
        "none";

      nextButton.style.display =
        "none";
    }


    function stopCamera() {

      scanning = false;

      if (animationId) {

        cancelAnimationFrame(
          animationId
        );

        animationId = null;
      }

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

        stream = null;
      }

      video.srcObject = null;
    }


    async function startCamera() {

      stopCamera();

      currentIsbn = "";

      clearBookDisplay();

      cameraWrap.style.display =
        "block";

      resultElement.textContent =
        "まだありません";

      setMessage(
        "カメラを起動しています…"
      );

      retryCameraButton.style.display =
        "none";

      try {

        stream =
          await navigator
            .mediaDevices
            .getUserMedia({

              audio: false,

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              }

            });

        video.srcObject =
          stream;

        await video.play();

        scanning = true;

        setMessage(
          "バーコードを枠に合わせてください。"
        );

        requestScan();

      } catch (error) {

        console.error(error);

        setMessage(
          "カメラを起動できませんでした。" +
          "（" +
          (error.name || "不明なエラー") +
          "）",
          "error"
        );

        retryCameraButton.style.display =
          "block";
      }
    }


    function requestScan() {

      if (!scanning) {
        return;
      }

      animationId =
        requestAnimationFrame(
          scanFrame
        );
    }


    async function scanFrame(timestamp) {

      if (!scanning) {
        return;
      }

      if (
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        requestScan();
        return;
      }

      if (
        decoding ||
        timestamp - lastDecodeTime <
          DECODE_INTERVAL
      ) {

        requestScan();
        return;
      }

      lastDecodeTime =
        timestamp;

      decoding = true;

      try {

        const sourceWidth =
          video.videoWidth;

        const sourceHeight =
          video.videoHeight;

        const cropWidth =
          Math.floor(
            sourceWidth * 0.90
          );

        const cropHeight =
          Math.floor(
            sourceHeight * 0.30
          );

        const cropX =
          Math.floor(
            (
              sourceWidth -
              cropWidth
            ) / 2
          );

        const cropY =
          Math.floor(
            (
              sourceHeight -
              cropHeight
            ) / 2
          );

        const targetWidth =
          1200;

        const scale =
          targetWidth /
          cropWidth;

        const targetHeight =
          Math.max(
            180,
            Math.floor(
              cropHeight *
              scale
            )
          );

        canvas.width =
          targetWidth;

        canvas.height =
          targetHeight;

        context.drawImage(
          video,
          cropX,
          cropY,
          cropWidth,
          cropHeight,
          0,
          0,
          targetWidth,
          targetHeight
        );

        const imageData =
          context.getImageData(
            0,
            0,
            targetWidth,
            targetHeight
          );

        const results =
          await ZXingWASM
            .readBarcodes(
              imageData,
              {
                formats: [
                  "EAN13"
                ],
                tryHarder: true,
                maxNumberOfSymbols: 1
              }
            );

        if (
          results &&
          results.length > 0
        ) {

          const code =
            normalizeCode(
              results[0].text
            );

          resultElement.textContent =
            code;

          if (isIsbn(code)) {

            currentIsbn = code;

            stopCamera();

            cameraWrap.style.display =
              "none";

            setMessage(
              "ISBNを読み取りました。書誌情報を検索しています…"
            );

            await fetchOpenBd(code);

            return;

          } else if (
            isSecondBarcode(code)
          ) {

            setMessage(
              "2段目のバーコードを読み取りました。1段目を読み直してください。",
              "error"
            );

          } else {

            setMessage(
              "書籍のISBNではありません。",
              "error"
            );
          }
        }

      } catch (error) {

        console.warn(
          "読取エラー",
          error
        );

      } finally {

        decoding = false;

        requestScan();
      }
    }


    async function fetchOpenBd(isbn) {

      retryOpenBdButton.style.display =
        "none";

      nextButton.style.display =
        "none";

      try {

        const url =
          "https://api.openbd.jp/v1/get?isbn=" +
          encodeURIComponent(isbn);

        const response =
          await fetch(url);

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );
        }

        const data =
          await response.json();

        if (
          !Array.isArray(data) ||
          data.length === 0 ||
          data[0] === null
        ) {

          bookCard.style.display =
            "none";

          setMessage(
            "OpenBDに書誌情報がありませんでした。",
            "error"
          );

          nextButton.style.display =
            "block";

          return;
        }


        const summary =
          data[0].summary || {};


        bookTitle.textContent =
          summary.title ||
          "（書名なし）";

        bookPublisher.textContent =
          summary.publisher ||
          "（出版社なし）";

        bookAuthor.textContent =
          summary.author ||
          "（著者情報なし）";

        bookIsbn.textContent =
          isbn;


        bookCard.style.display =
          "block";

        setMessage(
          "書誌情報を取得しました。",
          "success"
        );

        nextButton.style.display =
          "block";


      } catch (error) {

        console.error(
          "OpenBD通信エラー",
          error
        );

        setMessage(
          "書誌情報を取得できませんでした。通信状況を確認して、もう一度お試しください。",
          "error"
        );

        retryOpenBdButton.style.display =
          "block";

        nextButton.style.display =
          "block";
      }
    }


    retryCameraButton.addEventListener(
      "click",
      startCamera
    );


    retryOpenBdButton.addEventListener(
      "click",
      function() {

        if (!currentIsbn) {
          return;
        }

        setMessage(
          "書誌情報を再検索しています…"
        );

        fetchOpenBd(
          currentIsbn
        );
      }
    );


    nextButton.addEventListener(
      "click",
      startCamera
    );


    window.addEventListener(
      "load",
      async function() {

        if (
          typeof ZXingWASM ===
            "undefined" ||
          typeof ZXingWASM
            .readBarcodes !==
            "function"
        ) {

          setMessage(
            "バーコード読み取りプログラムを読み込めませんでした。",
            "error"
          );

          return;
        }

        await startCamera();
      }
    );


    window.addEventListener(
      "pagehide",
      stopCamera
    );

  </script>

</body>
</html>
