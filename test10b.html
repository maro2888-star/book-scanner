<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホde選書 Test10-B</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      margin-top: 12px;
      box-sizing: border-box;
      font-family: monospace;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .box {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test10-B</h1>

  <p>
    RSA-OAEP + AES-GCM<br>
    実暗号化データ → Cloudflare Worker → D1
  </p>

  <div class="box">
    <strong>テスト用公開鍵</strong>

    <p>
      まず暗号鍵を作成します。
    </p>

    <button id="generateButton">
      RSA鍵ペアを作成
    </button>

    <textarea id="publicKeyBox" readonly
      placeholder="公開鍵がここに表示されます"></textarea>
  </div>

  <div class="box">
    <strong>暗号化して送信</strong>

    <button id="sendButton" disabled>
      実データを暗号化して1件送信
    </button>
  </div>

  <div id="result">
    まだ実行していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev/";

    let rsaKeyPair = null;

    document
      .getElementById("generateButton")
      .addEventListener("click", generateRsaKeyPair);

    document
      .getElementById("sendButton")
      .addEventListener("click", encryptAndSend);

    async function generateRsaKeyPair() {
      const result = document.getElementById("result");
      const sendButton = document.getElementById("sendButton");

      result.textContent = "RSA鍵ペアを作成中です...";

      try {
        rsaKeyPair = await crypto.subtle.generateKey(
          {
            name: "RSA-OAEP",
            modulusLength: 2048,
            publicExponent: new Uint8Array([1, 0, 1]),
            hash: "SHA-256"
          },
          true,
          ["encrypt", "decrypt"]
        );

        const spki = await crypto.subtle.exportKey(
          "spki",
          rsaKeyPair.publicKey
        );

        document.getElementById("publicKeyBox").value =
          arrayBufferToPem(
            spki,
            "PUBLIC KEY"
          );

        sendButton.disabled = false;

        result.textContent =
          "RSA鍵ペアを作成しました。\n\n" +
          "次に「実データを暗号化して1件送信」を押してください。";

      } catch (error) {
        result.textContent =
          "RSA鍵ペア作成エラー\n\n" +
          error.message;
      }
    }

    async function encryptAndSend() {
      const button = document.getElementById("sendButton");
      const result = document.getElementById("result");

      if (!rsaKeyPair) {
        result.textContent =
          "先にRSA鍵ペアを作成してください。";
        return;
      }

      button.disabled = true;
      result.textContent =
        "暗号化して送信中です...";

      try {
        const registrationId =
          "test10b-" +
          Date.now() +
          "-" +
          crypto.randomUUID();

        const plainData = {
          registrantName: "Aさん",
          isbn: "9784167920616",
          publisher: "テスト出版社",
          title: "Test10-B 暗号化確認用書籍",
          author: "テスト著者",
          price: 1800
        };

        // 1件ごとに新しいAES-GCM鍵
        const aesKey =
          await crypto.subtle.generateKey(
            {
              name: "AES-GCM",
              length: 256
            },
            true,
            ["encrypt", "decrypt"]
          );

        // 12byte IV
        const iv =
          crypto.getRandomValues(
            new Uint8Array(12)
          );

        const encodedPlainData =
          new TextEncoder().encode(
            JSON.stringify(plainData)
          );

        // 選書データ本体をAES-GCMで暗号化
        const ciphertextBuffer =
          await crypto.subtle.encrypt(
            {
              name: "AES-GCM",
              iv: iv
            },
            aesKey,
            encodedPlainData
          );

        // AES生鍵を取り出す
        const rawAesKey =
          await crypto.subtle.exportKey(
            "raw",
            aesKey
          );

        // AES鍵をRSA-OAEP公開鍵で暗号化
        const encryptedKeyBuffer =
          await crypto.subtle.encrypt(
            {
              name: "RSA-OAEP"
            },
            rsaKeyPair.publicKey,
            rawAesKey
          );

        const packageData = {
          registrationId: registrationId,
          eventId: "test10-event-001",
          iv: arrayBufferToBase64(iv.buffer),
          encryptedKey:
            arrayBufferToBase64(
              encryptedKeyBuffer
            ),
          ciphertext:
            arrayBufferToBase64(
              ciphertextBuffer
            ),
          schemaVersion: "test10b-1"
        };

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify(
                  packageData
                )
            }
          );

        const responseText =
          await response.text();

        let responseData;

        try {
          responseData =
            JSON.parse(responseText);
        } catch {
          responseData =
            responseText;
        }

        result.textContent =
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(
            responseData,
            null,
            2
          ) +
          "\n\n" +
          "平文テストデータ:\n" +
          JSON.stringify(
            plainData,
            null,
            2
          );

      } catch (error) {
        result.textContent =
          "暗号化または送信エラー\n\n" +
          error.message;

      } finally {
        button.disabled = false;
      }
    }

    function arrayBufferToBase64(buffer) {
      const bytes =
        new Uint8Array(buffer);

      let binary = "";

      for (let i = 0; i < bytes.length; i++) {
        binary +=
          String.fromCharCode(bytes[i]);
      }

      return btoa(binary);
    }

    function arrayBufferToPem(
      buffer,
      label
    ) {
      const base64 =
        arrayBufferToBase64(buffer);

      const lines =
        base64.match(/.{1,64}/g);

      return (
        "-----BEGIN " +
        label +
        "-----\n" +
        lines.join("\n") +
        "\n-----END " +
        label +
        "-----"
      );
    }
  </script>

</body>
</html>
