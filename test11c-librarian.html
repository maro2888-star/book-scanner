<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スマホde選書 Test11-C 司書側</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test11-C</h1>

  <p>
    司書側・OPEN/CLOSE署名実証
  </p>

  <div class="box">

    <p>
      対象イベント：
      <strong>test11-event-001</strong>
    </p>

    <button id="generateButton">
      署名用鍵を生成する
    </button>

    <p class="note">
      Test11-Cでは、秘密鍵はこのブラウザ内だけに保持します。
      Cloudflare側へ送るのは公開鍵だけです。
    </p>

  </div>

  <div id="result">
    まだ署名用鍵を生成していません。
  </div>

  <script>
    let signingKeyPair = null;

    document
      .getElementById("generateButton")
      .addEventListener("click", generateSigningKeys);

    async function generateSigningKeys() {

      const result =
        document.getElementById("result");

      result.textContent =
        "署名用鍵を生成しています...";

      try {

        signingKeyPair =
          await crypto.subtle.generateKey(
            {
              name: "ECDSA",
              namedCurve: "P-256"
            },
            true,
            ["sign", "verify"]
          );

        const publicKeyJwk =
          await crypto.subtle.exportKey(
            "jwk",
            signingKeyPair.publicKey
          );

        result.textContent =
          "署名用鍵の生成に成功しました。\n\n" +
          "方式：ECDSA P-256 / SHA-256\n\n" +
          "公開鍵（JWK）:\n" +
          JSON.stringify(
            publicKeyJwk,
            null,
            2
          ) +
          "\n\n" +
          "秘密鍵：ブラウザ内に保持しています。";

      } catch (error) {

        result.textContent =
          "鍵生成エラー\n\n" +
          error.message;
      }
    }
  </script>

</body>
</html>
