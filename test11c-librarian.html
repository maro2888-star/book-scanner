<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スマホde選書 Test11-C 司書側</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test11-C</h1>

  <p>
    司書側・OPEN/CLOSE署名実証
  </p>

  <div class="box">

    <p>
      対象イベント：
      <strong>test11-event-001</strong>
    </p>

    <button id="generateButton">
      1. 署名用鍵を生成する
    </button>

    <button id="registerButton" disabled>
      2. 公開鍵を登録する
    </button>

    <button id="openButton" disabled>
      3. 受付を開始する
    </button>

    <button id="closeButton" disabled>
      4. 受付を終了する
    </button>

    <p class="note">
      Test11-Cでは、秘密鍵はこのブラウザ内だけに保持します。
      Cloudflare側へ送るのは公開鍵と署名だけです。
    </p>

  </div>

  <div id="result">
    まだ操作していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev";

    const EVENT_ID =
      "test11-event-001";

    let signingKeyPair = null;
    let publicKeyJwk = null;


    document
      .getElementById("generateButton")
      .addEventListener(
        "click",
        generateSigningKeys
      );

    document
      .getElementById("registerButton")
      .addEventListener(
        "click",
        registerPublicKey
      );

    document
      .getElementById("openButton")
      .addEventListener(
        "click",
        () => sendEventCommand("OPEN")
      );

    document
      .getElementById("closeButton")
      .addEventListener(
        "click",
        () => sendEventCommand("CLOSE")
      );


    async function generateSigningKeys() {

      const result =
        document.getElementById("result");

      result.textContent =
        "署名用鍵を生成しています...";

      disableCommandButtons();

      try {

        signingKeyPair =
          await crypto.subtle.generateKey(
            {
              name: "ECDSA",
              namedCurve: "P-256"
            },
            true,
            ["sign", "verify"]
          );

        publicKeyJwk =
          await crypto.subtle.exportKey(
            "jwk",
            signingKeyPair.publicKey
          );

        document
          .getElementById("registerButton")
          .disabled = false;

        result.textContent =
          "署名用鍵の生成に成功しました。\n\n" +
          "方式：ECDSA P-256 / SHA-256\n\n" +
          "公開鍵（JWK）:\n" +
          JSON.stringify(
            publicKeyJwk,
            null,
            2
          ) +
          "\n\n" +
          "秘密鍵：ブラウザ内に保持しています。\n\n" +
          "次に「2. 公開鍵を登録する」を押してください。";

      } catch (error) {

        result.textContent =
          "鍵生成エラー\n\n" +
          error.message;
      }
    }


    async function registerPublicKey() {

      const result =
        document.getElementById("result");

      if (
        !signingKeyPair ||
        !publicKeyJwk
      ) {
        result.textContent =
          "先に署名用鍵を生成してください。";
        return;
      }

      result.textContent =
        "公開鍵を登録しています...";

      try {

        const response =
          await fetch(
            WORKER_URL +
            "/test11c/register-public-key",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  eventId:
                    EVENT_ID,
                  signingPublicKey:
                    publicKeyJwk
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {
          result.textContent =
            "公開鍵登録エラー\n\n" +
            "HTTP Status: " +
            response.status +
            "\n\n" +
            JSON.stringify(
              data,
              null,
              2
            );
          return;
        }

        document
          .getElementById("openButton")
          .disabled = false;

        document
          .getElementById("closeButton")
          .disabled = false;

        result.textContent =
          "公開鍵の登録に成功しました。\n\n" +
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(
            data,
            null,
            2
          ) +
          "\n\n" +
          "次に「3. 受付を開始する」を押せます。";

      } catch (error) {

        result.textContent =
          "公開鍵登録エラー\n\n" +
          error.message;
      }
    }


    async function sendEventCommand(
      command
    ) {

      const result =
        document.getElementById("result");

      if (!signingKeyPair) {
        result.textContent =
          "署名用秘密鍵がありません。";
        return;
      }

      const timestamp =
        new Date().toISOString();

      const message =
        EVENT_ID +
        "\n" +
        command +
        "\n" +
        timestamp;

      result.textContent =
        command +
        "命令に署名しています...";

      try {

        const signatureBuffer =
          await crypto.subtle.sign(
            {
              name: "ECDSA",
              hash: "SHA-256"
            },
            signingKeyPair.privateKey,
            new TextEncoder().encode(
              message
            )
          );

        const signature =
          uint8ArrayToBase64Url(
            new Uint8Array(
              signatureBuffer
            )
          );

        const response =
          await fetch(
            WORKER_URL +
            "/test11c/event-command",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  eventId:
                    EVENT_ID,
                  command:
                    command,
                  timestamp:
                    timestamp,
                  signature:
                    signature
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {
          result.textContent =
            "イベント状態変更エラー\n\n" +
            "HTTP Status: " +
            response.status +
            "\n\n" +
            JSON.stringify(
              data,
              null,
              2
            );
          return;
        }

        const japaneseCommand =
          command === "OPEN"
            ? "受付開始"
            : "受付終了";

        result.textContent =
          japaneseCommand +
          "に成功しました。\n\n" +
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(
            data,
            null,
            2
          ) +
          "\n\n" +
          "署名検証：成功";

      } catch (error) {

        result.textContent =
          "イベント状態変更エラー\n\n" +
          error.message;
      }
    }


    function disableCommandButtons() {

      document
        .getElementById("registerButton")
        .disabled = true;

      document
        .getElementById("openButton")
        .disabled = true;

      document
        .getElementById("closeButton")
        .disabled = true;
    }


    function uint8ArrayToBase64Url(
      bytes
    ) {

      let binary = "";

      for (
        let i = 0;
        i < bytes.length;
        i++
      ) {
        binary +=
          String.fromCharCode(
            bytes[i]
          );
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }
  </script>

</body>
</html>
