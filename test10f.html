<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホde選書 Test10-F</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test10-F</h1>

  <p>
    10件同時送信 → 全件保存確認 → 1件ACK → 残り9件確認
  </p>

  <button id="runButton">
    Test10-Fを実行
  </button>

  <div id="result">
    まだ実行していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev/";

    document
      .getElementById("runButton")
      .addEventListener("click", runTest10F);

    async function runTest10F() {
      const button =
        document.getElementById("runButton");

      const result =
        document.getElementById("result");

      button.disabled = true;

      try {
        const baseId =
          Date.now() +
          "-" +
          crypto.randomUUID();

        const ids = [];

        for (let i = 1; i <= 10; i++) {
          ids.push(
            "test10f-" +
            String(i).padStart(2, "0") +
            "-" +
            baseId
          );
        }

        result.textContent =
          "1. 10件を同時送信中...";

        const sendResults =
          await Promise.all(
            ids.map(
              (id, index) =>
                postRegistration(
                  id,
                  index + 1
                )
            )
          );

        const sendSuccessCount =
          sendResults.filter(
            item =>
              item.ok === true &&
              (
                item.status === "saved" ||
                item.status === "already_received"
              )
          ).length;

        result.textContent +=
          "\n2. 送信成功 " +
          sendSuccessCount +
          " / 10";

        result.textContent +=
          "\n3. D1上の存在確認中...";

        const beforeAckResults =
          await Promise.all(
            ids.map(
              id =>
                getRegistration(id)
            )
          );

        const beforeAckCount =
          beforeAckResults.filter(
            item => item !== null
          ).length;

        result.textContent +=
          "\n4. ACK前の存在件数：" +
          beforeAckCount +
          " / 10";

        if (beforeAckCount !== 10) {
          throw new Error(
            "ACK前に10件すべて確認できませんでした。"
          );
        }

        const ackTargetId =
          ids[0];

        result.textContent +=
          "\n5. 1件だけACK中...\n" +
          ackTargetId;

        const ackResponse =
          await fetch(
            WORKER_URL + "ack",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  registrationId:
                    ackTargetId
                })
            }
          );

        const ackData =
          await ackResponse.json();

        if (
          !ackResponse.ok ||
          ackData.ok !== true
        ) {
          throw new Error(
            "ACKに失敗しました: " +
            JSON.stringify(
              ackData
            )
          );
        }

        result.textContent +=
          "\n6. ACK成功";

        result.textContent +=
          "\n7. ACK後の状態を確認中...";

        const afterAckResults =
          await Promise.all(
            ids.map(
              id =>
                getRegistration(id)
            )
          );

        const deletedCount =
          afterAckResults.filter(
            item => item === null
          ).length;

        const remainingCount =
          afterAckResults.filter(
            item => item !== null
          ).length;

        const ackTargetDeleted =
          afterAckResults[0] === null;

        const otherNineRemain =
          afterAckResults
            .slice(1)
            .every(
              item => item !== null
            );

        const allRegistrationIdsUnique =
          new Set(ids).size === 10;

        result.textContent =
          "Test10-F 結果\n\n" +

          "同時送信件数：10\n" +
          "送信成功件数：" +
          sendSuccessCount +
          "\n" +

          "ACK前の存在件数：" +
          beforeAckCount +
          "\n\n" +

          "ACK対象：\n" +
          ackTargetId +
          "\n\n" +

          "ACK後：\n" +
          "削除済み件数：" +
          deletedCount +
          "\n" +
          "残存件数：" +
          remainingCount +
          "\n\n" +

          "確認結果：\n" +
          "registrationId 10件すべて一意 = " +
          (
            allRegistrationIdsUnique
              ? "OK"
              : "NG"
          ) +
          "\n" +

          "10件すべて保存確認 = " +
          (
            beforeAckCount === 10
              ? "OK"
              : "NG"
          ) +
          "\n" +

          "ACK対象1件だけ削除 = " +
          (
            ackTargetDeleted &&
            deletedCount === 1
              ? "OK"
              : "NG"
          ) +
          "\n" +

          "残り9件を保持 = " +
          (
            otherNineRemain &&
            remainingCount === 9
              ? "OK"
              : "NG"
          ) +
          "\n\n" +

          (
            allRegistrationIdsUnique &&
            beforeAckCount === 10 &&
            ackTargetDeleted &&
            deletedCount === 1 &&
            otherNineRemain &&
            remainingCount === 9
              ? "✅ 10件同時登録後、指定した1件だけ削除され、残り9件は保持されました。"
              : "❌ 想定どおりの結果ではありません。"
          );

      } catch (error) {
        result.textContent =
          "Test10-F エラー\n\n" +
          error.message;

      } finally {
        button.disabled = false;
      }
    }

    async function postRegistration(
      registrationId,
      number
    ) {
      const data = {
        registrationId:
          registrationId,
        eventId:
          "test10-event-001",
        iv:
          "TEST10F_IV_" +
          number,
        encryptedKey:
          "TEST10F_ENCRYPTED_KEY_" +
          number,
        ciphertext:
          "TEST10F_CIPHERTEXT_" +
          number,
        schemaVersion:
          "test10f-1"
      };

      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(data)
          }
        );

      const responseData =
        await response.json();

      if (
        !response.ok ||
        responseData.ok !== true
      ) {
        throw new Error(
          "保存失敗: " +
          registrationId +
          "\n" +
          JSON.stringify(
            responseData
          )
        );
      }

      return responseData;
    }

    async function getRegistration(
      registrationId
    ) {
      const response =
        await fetch(
          WORKER_URL +
          "?registrationId=" +
          encodeURIComponent(
            registrationId
          )
        );

      if (response.status === 404) {
        return null;
      }

      const data =
        await response.json();

      if (
        !response.ok ||
        data.ok !== true
      ) {
        throw new Error(
          "取得失敗: " +
          registrationId +
          "\n" +
          JSON.stringify(data)
        );
      }

      return data.registration;
    }
  </script>

</body>
</html>
