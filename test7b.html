<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>実証テスト8-F-1 後片付け</title>

  <style>

    body {
      font-family: sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .note {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      white-space: pre-wrap;
    }

  </style>
</head>


<body>

  <h1>実証テスト8-F-1 後片付け</h1>

  <div class="box">

    <p>
      受付に残っている
      「実証テスト8-F-1」の100件だけを確認し、
      そのregistrationIdだけをackします。
    </p>

    <div class="note">
      安全のため、次の条件をすべて確認できた場合だけ
      削除します。
      <br><br>
      ・受付全体が100件<br>
      ・8-F-1データが100件<br>
      ・registrationIdが100個すべて異なる<br>
      ・testIndex 1～100がすべて存在する
      <br><br>
      1つでも想定と違えば削除しません。
    </div>

    <button id="cleanupButton">
      8-F-1の100件を削除して0件を確認する
    </button>

    <div
      id="message"
      class="message"
    >
      まだ実行していません。
    </div>

  </div>


  <script>

    const RECEIVER_URL =
      "https://script.google.com/macros/s/AKfycbzwrpenfMoWg_39jjqn102JhJQph90vjldiwVNs9fyrX_8Y6EswcN4jI_ZlotR2Qc3i6Q/exec";


    const SELECTION_KEY =
      "TEST8A-001";


    const TEST_NAME =
      "実証テスト8-F-1";


    const EXPECTED_COUNT =
      100;


    const cleanupButton =
      document.getElementById(
        "cleanupButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    /*
     * 現在の受付データを取得する。
     */
    async function pullPendingData() {

      const url =
        RECEIVER_URL +
        "?action=pull" +
        "&selectionKey=" +
        encodeURIComponent(
          SELECTION_KEY
        ) +
        "&_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method:
              "GET",

            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "受付から正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    /*
     * 指定したregistrationIdだけをackする。
     */
    async function sendAck(
      registrationIds
    ) {

      const response =
        await fetch(
          RECEIVER_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                {
                  action:
                    "ack",

                  selectionKey:
                    SELECTION_KEY,

                  registrationIds:
                    registrationIds
                }
              )
          }
        );


      if (!response.ok) {

        throw new Error(
          "ackで正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    cleanupButton.addEventListener(
      "click",
      async function() {

        cleanupButton.disabled =
          true;


        message.textContent =
          "受付データを確認しています…";


        try {

          /*
           * --------------------------------
           * 1. 現在の受付を取得
           * --------------------------------
           */
          const before =
            await pullPendingData();


          const allData =
            Array.isArray(
              before.data
            )
              ? before.data
              : [];


          /*
           * --------------------------------
           * 2. 8-F-1だけを抽出
           * --------------------------------
           */
          const targetData =
            allData.filter(
              function(item) {

                return (
                  item &&
                  item.payload &&
                  item.payload.test ===
                    TEST_NAME
                );
              }
            );


          /*
           * --------------------------------
           * 3. registrationId確認
           * --------------------------------
           */
          const registrationIds =
            targetData
              .map(
                function(item) {

                  return item.registrationId;
                }
              )
              .filter(
                function(id) {

                  return (
                    typeof id === "string" &&
                    id.length > 0
                  );
                }
              );


          const uniqueRegistrationIds =
            new Set(
              registrationIds
            );


          /*
           * --------------------------------
           * 4. testIndex確認
           * --------------------------------
           */
          const testIndexes =
            targetData
              .map(
                function(item) {

                  return (
                    item &&
                    item.payload
                  )
                    ? item.payload.testIndex
                    : null;
                }
              )
              .filter(
                function(index) {

                  return (
                    Number.isInteger(
                      index
                    ) &&
                    index >= 1 &&
                    index <= EXPECTED_COUNT
                  );
                }
              );


          const uniqueTestIndexes =
            new Set(
              testIndexes
            );


          /*
           * 1～100で欠けている番号を調べる。
           */
          const missingIndexes =
            [];


          for (
            let index = 1;
            index <= EXPECTED_COUNT;
            index++
          ) {

            if (
              !uniqueTestIndexes.has(
                index
              )
            ) {

              missingIndexes.push(
                index
              );
            }
          }


          /*
           * --------------------------------
           * 5. 削除前の安全確認
           * --------------------------------
           *
           * すべて一致した場合だけackする。
           */
          const safeToDelete =

            before.success === true &&

            allData.length ===
              EXPECTED_COUNT &&

            targetData.length ===
              EXPECTED_COUNT &&

            registrationIds.length ===
              EXPECTED_COUNT &&

            uniqueRegistrationIds.size ===
              EXPECTED_COUNT &&

            testIndexes.length ===
              EXPECTED_COUNT &&

            uniqueTestIndexes.size ===
              EXPECTED_COUNT &&

            missingIndexes.length ===
              0;


          if (!safeToDelete) {

            message.textContent =
              "安全確認で停止しました。\n\n" +

              "受付全体：" +
              allData.length +
              "件\n" +

              "8-F-1データ：" +
              targetData.length +
              "件\n" +

              "registrationId：" +
              registrationIds.length +
              "個\n" +

              "異なるregistrationId：" +
              uniqueRegistrationIds.size +
              "個\n" +

              "testIndex：" +
              testIndexes.length +
              "個\n" +

              "異なるtestIndex：" +
              uniqueTestIndexes.size +
              "個\n" +

              "欠落番号：" +
              missingIndexes.length +
              "件\n\n" +

              (
                missingIndexes.length > 0
                  ? "欠落：" +
                    missingIndexes.join(", ") +
                    "\n\n"
                  : ""
              ) +

              "想定と一致しないため、" +
              "データは削除していません。\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください.";


            cleanupButton.disabled =
              false;


            return;
          }


          /*
           * --------------------------------
           * 6. 確認できた100個のIDだけack
           * --------------------------------
           */
          message.textContent =
            "安全確認OK\n\n" +
            "8-F-1の100件を確認しました。\n" +
            "対象のregistrationIdだけを削除しています…";


          const ackResult =
            await sendAck(
              registrationIds
            );


          /*
           * ack結果も確認。
           */
          if (
            !ackResult ||
            ackResult.success !== true ||
            ackResult.removedCount !==
              EXPECTED_COUNT
          ) {

            message.textContent =
              "ack結果が想定と異なります。\n\n" +

              "success：" +
              String(
                ackResult
                  ? ackResult.success
                  : "不明"
              ) +
              "\n" +

              "削除件数：" +
              String(
                ackResult &&
                typeof ackResult.removedCount ===
                  "number"
                  ? ackResult.removedCount
                  : "不明"
              ) +
              "件\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください。";


            return;
          }


          /*
           * --------------------------------
           * 7. 削除後に再pull
           * --------------------------------
           */
          const after =
            await pullPendingData();


          const remainingData =
            Array.isArray(
              after.data
            )
              ? after.data
              : [];


          /*
           * --------------------------------
           * 8. 0件を最終確認
           * --------------------------------
           */
          if (
            after.success === true &&
            remainingData.length === 0
          ) {

            message.textContent =
              "8-F-1 後片付け：成功\n\n" +

              "削除対象：100件\n" +
              "受付から削除：100件\n" +
              "受付の現在件数：0件\n\n" +

              "8-F-1のテストデータを" +
              "安全に整理しました。";


          } else {

            message.textContent =
              "100件のackは完了しましたが、" +
              "受付が0件ではありません。\n\n" +

              "受付の現在件数：" +
              remainingData.length +
              "件\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください。";
          }


        } catch (error) {

          message.textContent =
            "処理中にエラーが発生しました。\n\n" +
            String(error) +
            "\n\n" +

            "追加操作をせず、" +
            "この結果を確認してください。";


          cleanupButton.disabled =
            false;
        }

      }
    );

  </script>

</body>

</html>
