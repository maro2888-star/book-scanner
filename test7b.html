<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>実証テスト8-F-2 後片付け</title>

  <style>

    body {
      font-family: sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .details {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

  </style>
</head>


<body>

  <h1>スマホde選書システム</h1>

  <div class="box">

    <h2>実証テスト8-F-2 後片付け</h2>

    <div class="info">

      受付に残っている300件が、
      すべて実証テスト8-F-2のデータであることを確認します。

      <br><br>

      さらに、

      <br>

      ・registrationIdが300個すべて固有<br>
      ・testIndexが1～300すべて存在<br>
      ・欠落なし<br>
      ・重複なし

      <br><br>

      を確認できた場合だけ、
      その300件を受付から削除します。

      <br><br>

      条件が1つでも一致しない場合は、
      削除しません。

    </div>


    <button id="cleanupButton">
      8-F-2の300件を削除して0件を確認する
    </button>


    <div
      id="message"
      class="message"
    >
      まだ実行していません。
    </div>


    <div
      id="details"
      class="details"
    ></div>

  </div>


  <script>

    const RECEIVER_URL =
      "https://script.google.com/macros/s/AKfycbzwrpenfMoWg_39jjqn102JhJQph90vjldiwVNs9fyrX_8Y6EswcN4jI_ZlotR2Qc3i6Q/exec";


    const SELECTION_KEY =
      "TEST8A-001";


    const TEST_NAME =
      "実証テスト8-F-2";


    const EXPECTED_COUNT =
      300;


    const cleanupButton =
      document.getElementById(
        "cleanupButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const details =
      document.getElementById(
        "details"
      );


    /*
     * 現在の受付データを取得する。
     */
    async function pullPendingData() {

      const url =
        RECEIVER_URL +
        "?action=pull" +
        "&selectionKey=" +
        encodeURIComponent(
          SELECTION_KEY
        ) +
        "&_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method:
              "GET",

            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "受付から正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    /*
     * 保存済みregistrationIdを
     * 受付へackする。
     */
    async function sendAck(
      registrationIds
    ) {

      const payload = {

        action:
          "ack",

        selectionKey:
          SELECTION_KEY,

        registrationIds:
          registrationIds
      };


      const response =
        await fetch(
          RECEIVER_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      if (!response.ok) {

        throw new Error(
          "ack送信でHTTPエラー：" +
          response.status
        );
      }


      return await response.json();
    }


    /*
     * 後片付け開始。
     */
    cleanupButton.addEventListener(
      "click",
      async function() {

        cleanupButton.disabled =
          true;

        details.style.display =
          "none";

        details.textContent =
          "";

        message.textContent =
          "受付の300件を安全確認しています…";


        try {

          /*
           * ----------------------------
           * STEP 1
           * 現在の受付をpull
           * ----------------------------
           */
          const before =
            await pullPendingData();


          const allData =
            Array.isArray(
              before.data
            )
              ? before.data
              : [];


          /*
           * 8-F-2だけ抽出。
           */
          const targetData =
            allData.filter(
              function(item) {

                return (
                  item &&
                  item.payload &&
                  item.payload.test ===
                    TEST_NAME
                );
              }
            );


          /*
           * ----------------------------
           * registrationId確認
           * ----------------------------
           */
          const registrationIds =
            targetData
              .map(
                function(item) {

                  return item.registrationId;
                }
              )
              .filter(
                function(id) {

                  return (
                    typeof id === "string" &&
                    id.length > 0
                  );
                }
              );


          const uniqueRegistrationIds =
            new Set(
              registrationIds
            );


          /*
           * ----------------------------
           * testIndex確認
           * ----------------------------
           */
          const testIndexes =
            targetData
              .map(
                function(item) {

                  return (
                    item &&
                    item.payload
                  )
                    ? item.payload.testIndex
                    : null;
                }
              )
              .filter(
                function(index) {

                  return (
                    Number.isInteger(
                      index
                    ) &&
                    index >= 1 &&
                    index <= EXPECTED_COUNT
                  );
                }
              );


          const uniqueTestIndexes =
            new Set(
              testIndexes
            );


          /*
           * ----------------------------
           * 欠落番号確認
           * ----------------------------
           */
          const missingIndexes =
            [];


          for (
            let index = 1;
            index <= EXPECTED_COUNT;
            index++
          ) {

            if (
              !uniqueTestIndexes.has(
                index
              )
            ) {

              missingIndexes.push(
                index
              );
            }
          }


          /*
           * ----------------------------
           * 重複番号確認
           * ----------------------------
           */
          const indexCounts =
            new Map();


          testIndexes.forEach(
            function(index) {

              indexCounts.set(
                index,
                (
                  indexCounts.get(
                    index
                  ) || 0
                ) + 1
              );
            }
          );


          const duplicateIndexes =
            [];


          indexCounts.forEach(
            function(count, index) {

              if (count > 1) {

                duplicateIndexes.push(
                  index
                );
              }
            }
          );


          /*
           * ----------------------------
           * 安全条件
           * ----------------------------
           *
           * 1つでも違えばackしない。
           */
          const safeToDelete =

            before.success === true &&

            allData.length ===
              EXPECTED_COUNT &&

            targetData.length ===
              EXPECTED_COUNT &&

            registrationIds.length ===
              EXPECTED_COUNT &&

            uniqueRegistrationIds.size ===
              EXPECTED_COUNT &&

            testIndexes.length ===
              EXPECTED_COUNT &&

            uniqueTestIndexes.size ===
              EXPECTED_COUNT &&

            missingIndexes.length ===
              0 &&

            duplicateIndexes.length ===
              0;


          /*
           * ----------------------------
           * 条件不一致なら停止。
           * ackは送らない。
           * ----------------------------
           */
          if (!safeToDelete) {

            message.textContent =
              "後片付けを中止しました。\n\n" +

              "安全条件が一致しないため、" +
              "受付データは削除していません。\n\n" +

              "受付全体：" +
              allData.length +
              "件\n" +

              "8-F-2データ：" +
              targetData.length +
              "件\n\n" +

              "registrationId：" +
              registrationIds.length +
              "個\n" +

              "異なるregistrationId：" +
              uniqueRegistrationIds.size +
              "個\n\n" +

              "testIndex：" +
              testIndexes.length +
              "個\n" +

              "異なるtestIndex：" +
              uniqueTestIndexes.size +
              "個\n\n" +

              "欠落番号：" +
              missingIndexes.length +
              "件\n" +

              (
                missingIndexes.length > 0
                  ? "欠落：" +
                    missingIndexes.join(", ") +
                    "\n"
                  : ""
              ) +

              "重複番号：" +
              duplicateIndexes.length +
              "件\n" +

              (
                duplicateIndexes.length > 0
                  ? "重複：" +
                    duplicateIndexes.join(", ")
                  : ""
              ) +

              "\n\n追加操作をせず、" +
              "この結果を確認してください。";


            details.style.display =
              "block";


            details.textContent =
              JSON.stringify(
                {
                  beforeSuccess:
                    before.success,

                  allDataCount:
                    allData.length,

                  targetDataCount:
                    targetData.length,

                  registrationIdCount:
                    registrationIds.length,

                  uniqueRegistrationIdCount:
                    uniqueRegistrationIds.size,

                  testIndexCount:
                    testIndexes.length,

                  uniqueTestIndexCount:
                    uniqueTestIndexes.size,

                  missingIndexes:
                    missingIndexes,

                  duplicateIndexes:
                    duplicateIndexes
                },
                null,
                2
              );


            /*
             * 意図的にボタンは
             * 再有効化しない。
             */
            return;
          }


          /*
           * ----------------------------
           * STEP 2
           * 安全条件一致。
           * 300件のIDだけack。
           * ----------------------------
           */
          message.textContent =
            "300件すべての安全確認ができました。\n\n" +
            "受付から8-F-2の300件を削除しています…";


          const ackResult =
            await sendAck(
              registrationIds
            );


          /*
           * ackそのものの結果を確認。
           */
          if (
            ackResult.success !== true ||
            ackResult.removedCount !==
              EXPECTED_COUNT
          ) {

            message.textContent =
              "ack結果を確認する必要があります。\n\n" +

              "削除予定：" +
              EXPECTED_COUNT +
              "件\n" +

              "受付から削除：" +
              (
                typeof ackResult.removedCount ===
                "number"
                  ? ackResult.removedCount
                  : "不明"
              ) +
              "件\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください。";


            details.style.display =
              "block";


            details.textContent =
              JSON.stringify(
                ackResult,
                null,
                2
              );


            return;
          }


          /*
           * ----------------------------
           * STEP 3
           * ack後に再pull。
           * 本当に0件か確認。
           * ----------------------------
           */
          message.textContent =
            "300件を受付から削除しました。\n\n" +
            "受付が0件になったことを確認しています…";


          const after =
            await pullPendingData();


          const remainingData =
            Array.isArray(
              after.data
            )
              ? after.data
              : [];


          /*
           * ----------------------------
           * 最終成功条件
           * ----------------------------
           */
          if (
            after.success === true &&
            remainingData.length === 0
          ) {

            message.textContent =
              "8-F-2 後片付け：成功\n\n" +

              "削除対象：300件\n" +
              "受付から削除：300件\n" +
              "受付の現在件数：0件\n\n" +

              "8-F-2のテストデータを" +
              "安全に整理しました。";


            details.style.display =
              "block";


            details.textContent =
              "安全確認結果\n\n" +

              "受付全体：300件\n" +
              "8-F-2データ：300件\n" +
              "registrationId：300個\n" +
              "異なるregistrationId：300個\n" +
              "testIndex：300個\n" +
              "異なるtestIndex：300個\n" +
              "欠落番号：0件\n" +
              "重複番号：0件\n\n" +

              "ack後の受付：0件";


          } else {

            message.textContent =
              "後片付け後の確認が必要です。\n\n" +

              "受付からの削除処理は実行されましたが、" +
              "現在の受付件数が0件ではありません。\n\n" +

              "現在の受付：" +
              remainingData.length +
              "件\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください。";


            details.style.display =
              "block";


            details.textContent =
              JSON.stringify(
                after,
                null,
                2
              );
          }


        } catch (error) {

          message.textContent =
            "後片付け処理中にエラーが発生しました。\n\n" +

            String(error) +
            "\n\n" +

            "追加操作をせず、" +
            "この結果を確認してください。";


          details.style.display =
            "block";


          details.textContent =
            String(error);
        }

      }
    );

  </script>

</body>

</html>
