<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>実証テスト9-A</title>

  <style>

    body {
      font-family: sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .dataBox {
      margin-top: 18px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .cipherBox {
      margin-top: 18px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-all;
      font-size: 13px;
    }

  </style>
</head>


<body>

  <h1>スマホde選書システム</h1>

  <div class="box">

    <h2>実証テスト9-A</h2>

    <div class="info">

      ブラウザ内だけで暗号化と復号を行います。

      <br><br>

      ① AES-GCM 256bit鍵を自動生成<br>
      ② テスト用書籍データを暗号化<br>
      ③ 暗号文を確認<br>
      ④ 同じ鍵で復号<br>
      ⑤ 元データと完全一致するか確認

      <br><br>

      このテストでは、
      受付GASやスプレッドシートへ
      データを送信しません。

    </div>


    <button id="runButton">
      暗号化・復号テストを開始する
    </button>


    <div
      id="message"
      class="message"
    >
      まだ実行していません。
    </div>

  </div>


  <div class="box">

    <h2>① 元データ</h2>

    <div
      id="originalData"
      class="dataBox"
    >
      未実行
    </div>

  </div>


  <div class="box">

    <h2>② 暗号化後</h2>

    <div
      id="encryptedData"
      class="cipherBox"
    >
      未実行
    </div>

  </div>


  <div class="box">

    <h2>③ 復号後</h2>

    <div
      id="decryptedData"
      class="dataBox"
    >
      未実行
    </div>

  </div>


  <div class="box">

    <h2>④ 比較結果</h2>

    <div
      id="comparisonResult"
      class="message"
    >
      未実行
    </div>

  </div>


  <script>

    const runButton =
      document.getElementById(
        "runButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const originalDataBox =
      document.getElementById(
        "originalData"
      );


    const encryptedDataBox =
      document.getElementById(
        "encryptedData"
      );


    const decryptedDataBox =
      document.getElementById(
        "decryptedData"
      );


    const comparisonResult =
      document.getElementById(
        "comparisonResult"
      );


    /*
     * --------------------------------
     * Test9-Aで使う元データ
     * --------------------------------
     */
    const TEST_DATA = {

      userName:
        "テスト生徒",

      isbn:
        "9784000000001",

      publisher:
        "テスト出版社",

      title:
        "暗号化テスト書籍",

      price:
        1800
    };


    /*
     * Uint8ArrayをBase64へ変換。
     *
     * Test9-Aでは暗号文とIVを
     * 画面で確認しやすくするために使う。
     */
    function uint8ArrayToBase64(
      uint8Array
    ) {

      let binary =
        "";


      const chunkSize =
        0x8000;


      for (
        let i = 0;
        i < uint8Array.length;
        i += chunkSize
      ) {

        const chunk =
          uint8Array.subarray(
            i,
            i + chunkSize
          );


        binary +=
          String.fromCharCode.apply(
            null,
            chunk
          );
      }


      return btoa(
        binary
      );
    }


    /*
     * ArrayBufferをBase64へ変換。
     */
    function arrayBufferToBase64(
      buffer
    ) {

      return uint8ArrayToBase64(
        new Uint8Array(
          buffer
        )
      );
    }


    /*
     * --------------------------------
     * AES-GCM 256bit鍵を生成
     * --------------------------------
     */
    async function generateEncryptionKey() {

      return await window.crypto.subtle.generateKey(
        {
          name:
            "AES-GCM",

          length:
            256
        },

        true,

        [
          "encrypt",
          "decrypt"
        ]
      );
    }


    /*
     * --------------------------------
     * 暗号化
     * --------------------------------
     */
    async function encryptData(
      key,
      plainText
    ) {

      /*
       * AES-GCM用のIV。
       *
       * 暗号化のたびに
       * 新しい12バイトの乱数を作る。
       */
      const iv =
        window.crypto.getRandomValues(
          new Uint8Array(
            12
          )
        );


      /*
       * JavaScript文字列を
       * UTF-8のバイト列へ変換。
       */
      const encodedData =
        new TextEncoder().encode(
          plainText
        );


      /*
       * AES-GCMで暗号化。
       */
      const encryptedBuffer =
        await window.crypto.subtle.encrypt(
          {
            name:
              "AES-GCM",

            iv:
              iv
          },

          key,

          encodedData
        );


      return {

        iv:
          iv,

        encryptedBuffer:
          encryptedBuffer
      };
    }


    /*
     * --------------------------------
     * 復号
     * --------------------------------
     */
    async function decryptData(
      key,
      iv,
      encryptedBuffer
    ) {

      const decryptedBuffer =
        await window.crypto.subtle.decrypt(
          {
            name:
              "AES-GCM",

            iv:
              iv
          },

          key,

          encryptedBuffer
        );


      return new TextDecoder().decode(
        decryptedBuffer
      );
    }


    /*
     * --------------------------------
     * Test9-A開始
     * --------------------------------
     */
    runButton.addEventListener(
      "click",
      async function() {

        runButton.disabled =
          true;


        message.textContent =
          "暗号化・復号テストを実行しています…";


        originalDataBox.textContent =
          "処理中…";


        encryptedDataBox.textContent =
          "処理中…";


        decryptedDataBox.textContent =
          "処理中…";


        comparisonResult.textContent =
          "処理中…";


        try {

          /*
           * Web Crypto APIが
           * 利用できるか確認。
           */
          if (
            !window.crypto ||
            !window.crypto.subtle
          ) {

            throw new Error(
              "このブラウザではWeb Crypto APIを利用できません。"
            );
          }


          /*
           * --------------------------------
           * STEP 1
           * 元データをJSON文字列化
           * --------------------------------
           */
          const originalJson =
            JSON.stringify(
              TEST_DATA
            );


          originalDataBox.textContent =
            JSON.stringify(
              TEST_DATA,
              null,
              2
            );


          /*
           * --------------------------------
           * STEP 2
           * AES-GCM 256bit鍵生成
           * --------------------------------
           */
          const key =
            await generateEncryptionKey();


          /*
           * Test9-Aでは確認用として
           * 鍵を一度エクスポートする。
           *
           * 本番で鍵を画面表示するためではない。
           */
          const rawKey =
            await window.crypto.subtle.exportKey(
              "raw",
              key
            );


          const keyBase64 =
            arrayBufferToBase64(
              rawKey
            );


          /*
           * --------------------------------
           * STEP 3
           * 暗号化
           * --------------------------------
           */
          const encrypted =
            await encryptData(
              key,
              originalJson
            );


          const ivBase64 =
            uint8ArrayToBase64(
              encrypted.iv
            );


          const cipherBase64 =
            arrayBufferToBase64(
              encrypted.encryptedBuffer
            );


          /*
           * 暗号化された結果を表示。
           *
           * keyはTest9-Aの確認用。
           * 本番の受付へは送らない。
           */
          encryptedDataBox.textContent =
            "【暗号方式】\n" +
            "AES-GCM 256bit\n\n" +

            "【Test9-A確認用 鍵】\n" +
            keyBase64 +
            "\n\n" +

            "【IV】\n" +
            ivBase64 +
            "\n\n" +

            "【暗号文】\n" +
            cipherBase64;


          /*
           * --------------------------------
           * STEP 4
           * 同じ鍵とIVで復号
           * --------------------------------
           */
          const decryptedJson =
            await decryptData(
              key,
              encrypted.iv,
              encrypted.encryptedBuffer
            );


          /*
           * JSONとして読み直す。
           */
          const decryptedObject =
            JSON.parse(
              decryptedJson
            );


          decryptedDataBox.textContent =
            JSON.stringify(
              decryptedObject,
              null,
              2
            );


          /*
           * --------------------------------
           * STEP 5
           * 元データと完全一致するか確認
           * --------------------------------
           */
          const decryptedNormalizedJson =
            JSON.stringify(
              decryptedObject
            );


          const exactMatch =
            originalJson ===
            decryptedNormalizedJson;


          /*
           * 暗号文の中に
           * 平文がそのまま存在していないことも
           * 補助的に確認する。
           */
          const plainTextValues = [

            TEST_DATA.userName,
            TEST_DATA.isbn,
            TEST_DATA.publisher,
            TEST_DATA.title,
            String(
              TEST_DATA.price
            )
          ];


          const plainTextFound =
            plainTextValues.some(
              function(value) {

                return cipherBase64.includes(
                  value
                );
              }
            );


          /*
           * --------------------------------
           * 最終判定
           * --------------------------------
           */
          if (
            exactMatch === true &&
            plainTextFound === false
          ) {

            message.textContent =
              "テスト9-A：成功";


            comparisonResult.textContent =
              "テスト9-A：成功\n\n" +

              "AES-GCM 256bit鍵生成：成功\n" +
              "暗号化：成功\n" +
              "復号：成功\n" +
              "元データとの完全一致：OK\n" +
              "暗号文内の平文確認：検出なし\n\n" +

              "ブラウザ内で、" +
              "元データを暗号化し、" +
              "同じ鍵で元のデータへ" +
              "正しく復号できました。";


          } else {

            message.textContent =
              "テスト9-A：要確認";


            comparisonResult.textContent =
              "テスト9-A：要確認\n\n" +

              "元データとの完全一致：" +
              (
                exactMatch
                  ? "OK"
                  : "NG"
              ) +
              "\n" +

              "暗号文内の平文確認：" +
              (
                plainTextFound
                  ? "平文を検出"
                  : "検出なし"
              ) +
              "\n\n" +

              "追加操作をせず、" +
              "この結果を確認してください。";
          }


        } catch (error) {

          message.textContent =
            "テスト9-A：エラー";


          comparisonResult.textContent =
            "暗号化・復号テスト中に" +
            "エラーが発生しました。\n\n" +

            String(error) +
            "\n\n" +

            "追加操作をせず、" +
            "この結果を確認してください。";


        } finally {

          /*
           * Test9-Aは一度だけ実行。
           * ボタンは再有効化しない。
           */
        }

      }
    );

  </script>

</body>

</html>
