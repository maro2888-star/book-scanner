<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>実証テスト8-E-2 後片付け</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .note {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
  </style>
</head>


<body>

  <h1>実証テスト8-E-2 後片付け</h1>

  <div class="box">

    <p>
      受付に残っている
      「実証テスト8-E-2」の10件だけを確認し、
      そのregistrationIdだけをackします。
    </p>

    <div class="note">
      安全のため、8-E-2のデータが
      ちょうど10件確認できた場合だけ削除します。
      想定と違う場合は削除しません。
    </div>

    <button id="cleanupButton">
      8-E-2の10件を削除して0件を確認する
    </button>

    <div
      id="message"
      class="message"
    >
      まだ実行していません。
    </div>

  </div>


  <script>

    const RECEIVER_URL =
      "https://script.google.com/macros/s/AKfycbzwrpenfMoWg_39jjqn102JhJQph90vjldiwVNs9fyrX_8Y6EswcN4jI_ZlotR2Qc3i6Q/exec";

    const SELECTION_KEY =
      "TEST8A-001";


    const cleanupButton =
      document.getElementById(
        "cleanupButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    async function pullPendingData() {

      const url =
        RECEIVER_URL +
        "?action=pull" +
        "&selectionKey=" +
        encodeURIComponent(
          SELECTION_KEY
        ) +
        "&_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "受付から正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    async function sendAck(
      registrationIds
    ) {

      const response =
        await fetch(
          RECEIVER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                {
                  action: "ack",
                  selectionKey:
                    SELECTION_KEY,
                  registrationIds:
                    registrationIds
                }
              )
          }
        );


      if (!response.ok) {
        throw new Error(
          "ackで正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    cleanupButton.addEventListener(
      "click",
      async function() {

        cleanupButton.disabled =
          true;

        message.textContent =
          "受付データを確認しています…";


        try {

          /*
           * まず現在の受付データを取得。
           */
          const before =
            await pullPendingData();


          const allData =
            Array.isArray(
              before.data
            )
              ? before.data
              : [];


          /*
           * 8-E-2のデータだけを抽出。
           */
          const targetData =
            allData.filter(
              function(item) {

                return (
                  item &&
                  item.payload &&
                  item.payload.test ===
                    "実証テスト8-E-2"
                );
              }
            );


          /*
           * registrationIdを取得。
           */
          const ids =
            targetData
              .map(
                function(item) {
                  return item.registrationId;
                }
              )
              .filter(
                function(id) {
                  return (
                    typeof id === "string" &&
                    id.length > 0
                  );
                }
              );


          const uniqueIds =
            new Set(ids);


          /*
           * 安全確認。
           *
           * ・受付全体が10件
           * ・8-E-2が10件
           * ・registrationIdが10個
           * ・すべて異なる
           *
           * この4条件を満たさなければ
           * ackしない。
           */
          if (
            allData.length !== 10 ||
            targetData.length !== 10 ||
            ids.length !== 10 ||
            uniqueIds.size !== 10
          ) {

            message.textContent =
              "安全確認で停止しました。\n\n" +
              "受付全体：" +
              allData.length +
              "件\n" +
              "8-E-2データ：" +
              targetData.length +
              "件\n" +
              "registrationId：" +
              ids.length +
              "個\n" +
              "異なるregistrationId：" +
              uniqueIds.size +
              "個\n\n" +
              "想定と一致しないため、" +
              "データは削除していません。";

            cleanupButton.disabled =
              false;

            return;
          }


          message.textContent =
            "8-E-2の10件を確認しました。\n" +
            "対象のregistrationIdだけを削除しています…";


          /*
           * 確認できた10個のIDだけをack。
           */
          const ackResult =
            await sendAck(ids);


          if (
            !ackResult.success ||
            ackResult.removedCount !== 10
          ) {

            message.textContent =
              "ack結果が想定と異なります。\n\n" +
              "success：" +
              String(
                ackResult.success
              ) +
              "\n" +
              "削除件数：" +
              String(
                ackResult.removedCount
              ) +
              "件\n\n" +
              "追加操作をせず、" +
              "この結果を確認してください。";

            return;
          }


          /*
           * ack後にもう一度pullして
           * 本当に0件になったか確認。
           */
          const after =
            await pullPendingData();


          const remainingData =
            Array.isArray(
              after.data
            )
              ? after.data
              : [];


          if (
            after.success &&
            remainingData.length === 0
          ) {

            message.textContent =
              "8-E-2 後片付け：成功\n\n" +
              "削除対象：10件\n" +
              "受付から削除：10件\n" +
              "受付の現在件数：0件\n\n" +
              "8-E-2のテストデータを" +
              "安全に整理しました。";

          } else {

            message.textContent =
              "ackは完了しましたが、" +
              "受付が0件ではありません。\n\n" +
              "受付の現在件数：" +
              remainingData.length +
              "件\n\n" +
              "追加操作をせず、" +
              "この結果を確認してください。";
          }


        } catch (error) {

          message.textContent =
            "処理中にエラーが発生しました。\n\n" +
            String(error) +
            "\n\n" +
            "追加操作をせず、" +
            "この結果を確認してください。";

          cleanupButton.disabled =
            false;
        }

      }
    );

  </script>

</body>

</html>
