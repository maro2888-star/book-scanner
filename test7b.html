<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>実証テスト8-F-2</title>

  <style>

    body {
      font-family: sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .progress {
      margin-top: 18px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .dataBox {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

  </style>
</head>


<body>

  <h1>スマホde選書システム</h1>

  <p>
    実証テスト8-F-2：
    300件規模の受付・一時保存を確認します。
  </p>


  <div class="box">

    <h2>① 受付が0件か確認する</h2>

    <p>
      前回のテストデータが残っていないことを確認します。
      受付が0件の場合だけ300件送信を開始できます。
    </p>

    <button id="checkButton">
      受付が0件か確認する
    </button>

    <div
      id="checkMessage"
      class="message"
    >
      まだ確認していません。
    </div>

  </div>


  <div class="box">

    <h2>② 300件を送信する</h2>

    <div class="info">
      10件をほぼ同時に送信し、
      それを30グループ繰り返します。
      <br><br>
      合計300件を受付へ送信します。
      <br><br>
      送信方式：10件並列 × 30グループ<br>
      グループ間隔：300ミリ秒
    </div>

    <button
      id="runButton"
      disabled
    >
      300件送信テストを開始する
    </button>

    <div
      id="runMessage"
      class="message"
    >
      まだ実行していません。
    </div>

    <div
      id="progress"
      class="progress"
    >
      進行状況：未開始
    </div>

    <div
      id="resultBox"
      class="dataBox"
    ></div>

  </div>


  <script>

    const RECEIVER_URL =
      "https://script.google.com/macros/s/AKfycbzwrpenfMoWg_39jjqn102JhJQph90vjldiwVNs9fyrX_8Y6EswcN4jI_ZlotR2Qc3i6Q/exec";


    const SELECTION_KEY =
      "TEST8A-001";


    const TEST_NAME =
      "実証テスト8-F-2";


    const TOTAL_COUNT =
      300;


    const GROUP_SIZE =
      10;


    const GROUP_COUNT =
      TOTAL_COUNT / GROUP_SIZE;


    const GROUP_INTERVAL_MS =
      300;


    const checkButton =
      document.getElementById(
        "checkButton"
      );


    const runButton =
      document.getElementById(
        "runButton"
      );


    const checkMessage =
      document.getElementById(
        "checkMessage"
      );


    const runMessage =
      document.getElementById(
        "runMessage"
      );


    const progress =
      document.getElementById(
        "progress"
      );


    const resultBox =
      document.getElementById(
        "resultBox"
      );


    /*
     * 指定時間待つ。
     */
    function sleep(milliseconds) {

      return new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }


    /*
     * 現在の受付データを取得する。
     */
    async function pullPendingData() {

      const url =
        RECEIVER_URL +
        "?action=pull" +
        "&selectionKey=" +
        encodeURIComponent(
          SELECTION_KEY
        ) +
        "&_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method:
              "GET",

            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "受付から正常な応答がありませんでした。"
        );
      }


      return await response.json();
    }


    /*
     * -------------------------------
     * STEP 1
     * 受付が0件か確認。
     * -------------------------------
     */
    checkButton.addEventListener(
      "click",
      async function() {

        checkButton.disabled =
          true;

        runButton.disabled =
          true;

        checkMessage.textContent =
          "現在の受付データを確認しています…";


        try {

          const result =
            await pullPendingData();


          const data =
            Array.isArray(
              result.data
            )
              ? result.data
              : [];


          if (
            result.success === true &&
            data.length === 0
          ) {

            checkMessage.textContent =
              "開始条件OK\n\n" +
              "受付の現在件数：0件\n\n" +
              "8-F-2を開始できます。";


            runButton.disabled =
              false;


          } else {

            checkMessage.textContent =
              "テストを開始しません。\n\n" +
              "受付の現在件数：" +
              data.length +
              "件\n\n" +
              "受付が0件ではないため、" +
              "300件送信は実行できません。";


            checkButton.disabled =
              false;
          }


        } catch (error) {

          checkMessage.textContent =
            "確認中にエラーが発生しました。\n\n" +
            String(error);


          checkButton.disabled =
            false;
        }

      }
    );


    /*
     * 8-F-2用の1件分のテストデータ。
     */
    function createTestPayload(index) {

      const number =
        String(index).padStart(
          3,
          "0"
        );


      return {

        test:
          TEST_NAME,

        testIndex:
          index,

        selectionKey:
          SELECTION_KEY,

        userName:
          "300件テスト生徒" +
          number,

        isbn:
          "9787000" +
          String(index).padStart(
            6,
            "0"
          ),

        title:
          "8-F-2 300件テスト書籍" +
          number
      };
    }


    /*
     * 1件を受付へPOSTする。
     */
    async function sendOneRegistration(
      index
    ) {

      const payload =
        createTestPayload(
          index
        );


      const response =
        await fetch(
          RECEIVER_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      if (!response.ok) {

        throw new Error(
          "登録POST HTTPエラー：" +
          response.status
        );
      }


      const result =
        await response.json();


      return {

        index:
          index,

        payload:
          payload,

        result:
          result
      };
    }


    /*
     * -------------------------------
     * STEP 2
     * 300件送信。
     * -------------------------------
     */
    runButton.addEventListener(
      "click",
      async function() {

        runButton.disabled =
          true;

        checkButton.disabled =
          true;

        resultBox.style.display =
          "none";

        resultBox.textContent =
          "";


        runMessage.textContent =
          "300件送信テストを実行しています…";


        progress.textContent =
          "進行状況：開始";


        const startTime =
          performance.now();


        try {

          /*
           * 全300件の通信結果を保持する。
           */
          const allSettledResults =
            [];


          /*
           * 途中経過の集計。
           */
          let runningFulfilled =
            0;

          let runningRejected =
            0;

          let runningSuccessTrue =
            0;

          let runningSuccessFalse =
            0;


          /*
           * 10件 × 30グループ。
           */
          for (
            let group = 0;
            group < GROUP_COUNT;
            group++
          ) {

            const firstIndex =
              group * GROUP_SIZE + 1;


            const lastIndex =
              firstIndex +
              GROUP_SIZE -
              1;


            progress.textContent =
              "進行状況：" +
              (group + 1) +
              " / " +
              GROUP_COUNT +
              " グループ\n\n" +

              "送信中：" +
              firstIndex +
              " ～ " +
              lastIndex +
              "件目\n\n" +

              "ここまでの通信完了：" +
              runningFulfilled +
              "件\n" +

              "ここまでのsuccess:true：" +
              runningSuccessTrue +
              "件\n" +

              "ここまでの通信失敗：" +
              runningRejected +
              "件";


            /*
             * このグループの10件を
             * 並列で開始する。
             */
            const groupPromises =
              [];


            for (
              let index = firstIndex;
              index <= lastIndex;
              index++
            ) {

              groupPromises.push(
                sendOneRegistration(
                  index
                )
              );
            }


            /*
             * 10件すべての終了を待つ。
             */
            const groupResults =
              await Promise.allSettled(
                groupPromises
              );


            allSettledResults.push(
              ...groupResults
            );


            /*
             * このグループの結果を
             * すぐに集計しておく。
             */
            groupResults.forEach(
              function(item) {

                if (
                  item.status ===
                  "fulfilled"
                ) {

                  runningFulfilled++;


                  if (
                    item.value &&
                    item.value.result &&
                    item.value.result.success === true
                  ) {

                    runningSuccessTrue++;

                  } else {

                    runningSuccessFalse++;
                  }


                } else {

                  runningRejected++;
                }

              }
            );


            progress.textContent =
              "進行状況：" +
              (group + 1) +
              " / " +
              GROUP_COUNT +
              " グループ完了\n\n" +

              "処理済み：" +
              allSettledResults.length +
              " / " +
              TOTAL_COUNT +
              "件\n" +

              "通信完了：" +
              runningFulfilled +
              "件\n" +

              "success:true：" +
              runningSuccessTrue +
              "件\n" +

              "success:false：" +
              runningSuccessFalse +
              "件\n" +

              "通信失敗：" +
              runningRejected +
              "件";


            /*
             * 最後のグループ以外は
             * 300ms待つ。
             */
            if (
              group <
              GROUP_COUNT - 1
            ) {

              await sleep(
                GROUP_INTERVAL_MS
              );
            }
          }


          const sendEndTime =
            performance.now();


          const sendSeconds =
            (
              (
                sendEndTime -
                startTime
              ) /
              1000
            ).toFixed(2);


          /*
           * --------------------------------
           * POST結果の最終集計
           * --------------------------------
           */
          let fulfilledCount =
            0;

          let rejectedCount =
            0;

          let successTrueCount =
            0;

          let successFalseCount =
            0;


          const responseDetails =
            [];


          allSettledResults.forEach(
            function(item, position) {

              const requestNumber =
                position + 1;


              if (
                item.status ===
                "fulfilled"
              ) {

                fulfilledCount++;


                if (
                  item.value &&
                  item.value.result &&
                  item.value.result.success === true
                ) {

                  successTrueCount++;

                } else {

                  successFalseCount++;
                }


                responseDetails.push({

                  request:
                    requestNumber,

                  status:
                    "fulfilled",

                  registrationId:
                    item.value &&
                    item.value.result
                      ? item.value.result.registrationId
                      : null,

                  response:
                    item.value
                      ? item.value.result
                      : null
                });


              } else {

                rejectedCount++;


                responseDetails.push({

                  request:
                    requestNumber,

                  status:
                    "rejected",

                  error:
                    String(
                      item.reason
                    )
                });
              }

            }
          );


          progress.textContent =
            "進行状況：300件の送信処理完了\n\n" +
            "受付の最終状態を確認しています…";


          /*
           * --------------------------------
           * 受付をpull
           * --------------------------------
           */
          const finalPull =
            await pullPendingData();


          const finalData =
            Array.isArray(
              finalPull.data
            )
              ? finalPull.data
              : [];


          const finalCount =
            finalData.length;


          /*
           * --------------------------------
           * 8-F-2だけ抽出
           * --------------------------------
           */
          const testData =
            finalData.filter(
              function(item) {

                return (
                  item &&
                  item.payload &&
                  item.payload.test ===
                    TEST_NAME
                );
              }
            );


          /*
           * --------------------------------
           * registrationId確認
           * --------------------------------
           */
          const registrationIds =
            testData
              .map(
                function(item) {

                  return item.registrationId;
                }
              )
              .filter(
                function(id) {

                  return (
                    typeof id === "string" &&
                    id.length > 0
                  );
                }
              );


          const uniqueRegistrationIds =
            new Set(
              registrationIds
            );


          /*
           * --------------------------------
           * testIndex 1～300確認
           * --------------------------------
           */
          const receivedIndexes =
            testData
              .map(
                function(item) {

                  return (
                    item &&
                    item.payload
                  )
                    ? item.payload.testIndex
                    : null;
                }
              )
              .filter(
                function(index) {

                  return (
                    Number.isInteger(
                      index
                    ) &&
                    index >= 1 &&
                    index <= TOTAL_COUNT
                  );
                }
              );


          const uniqueIndexes =
            new Set(
              receivedIndexes
            );


          /*
           * 欠落番号。
           */
          const missingIndexes =
            [];


          for (
            let index = 1;
            index <= TOTAL_COUNT;
            index++
          ) {

            if (
              !uniqueIndexes.has(
                index
              )
            ) {

              missingIndexes.push(
                index
              );
            }
          }


          /*
           * 重複番号。
           */
          const duplicateIndexes =
            [];


          const indexCounts =
            new Map();


          receivedIndexes.forEach(
            function(index) {

              indexCounts.set(
                index,
                (
                  indexCounts.get(
                    index
                  ) || 0
                ) + 1
              );
            }
          );


          indexCounts.forEach(
            function(count, index) {

              if (count > 1) {

                duplicateIndexes.push(
                  index
                );
              }
            }
          );


          /*
           * 最後に確認できたtestIndex。
           * 問題発生時の診断にも使う。
           */
          let highestReceivedIndex =
            0;


          uniqueIndexes.forEach(
            function(index) {

              if (
                index >
                highestReceivedIndex
              ) {

                highestReceivedIndex =
                  index;
              }
            }
          );


          const endTime =
            performance.now();


          const totalSeconds =
            (
              (
                endTime -
                startTime
              ) /
              1000
            ).toFixed(2);


          /*
           * --------------------------------
           * 成功条件
           * --------------------------------
           */
          const testSuccess =

            allSettledResults.length ===
              TOTAL_COUNT &&

            fulfilledCount ===
              TOTAL_COUNT &&

            rejectedCount ===
              0 &&

            successTrueCount ===
              TOTAL_COUNT &&

            successFalseCount ===
              0 &&

            finalPull.success ===
              true &&

            finalCount ===
              TOTAL_COUNT &&

            testData.length ===
              TOTAL_COUNT &&

            registrationIds.length ===
              TOTAL_COUNT &&

            uniqueRegistrationIds.size ===
              TOTAL_COUNT &&

            uniqueIndexes.size ===
              TOTAL_COUNT &&

            missingIndexes.length ===
              0 &&

            duplicateIndexes.length ===
              0;


          /*
           * --------------------------------
           * 結果表示
           * --------------------------------
           */
          if (testSuccess) {

            runMessage.textContent =
              "テスト8-F-2：成功\n\n" +

              "送信：300件\n" +
              "通信完了：300件\n" +
              "success:true：300件\n" +
              "通信失敗：0件\n\n" +

              "受付の最終件数：300件\n" +
              "8-F-2データ：300件\n\n" +

              "registrationId：300個\n" +
              "異なるregistrationId：300個\n\n" +

              "テスト番号：1～300すべて確認\n" +
              "欠落番号：0件\n" +
              "重複番号：0件\n\n" +

              "300件送信完了まで：" +
              sendSeconds +
              "秒\n" +

              "最終確認完了まで：" +
              totalSeconds +
              "秒\n\n" +

              "300件規模の連続・並列受付でも、" +
              "受付データの欠落は確認されませんでした。";


          } else {

            runMessage.textContent =
              "テスト8-F-2：要確認\n\n" +

              "送信予定：300件\n" +

              "処理結果取得：" +
              allSettledResults.length +
              "件\n" +

              "通信完了：" +
              fulfilledCount +
              "件\n" +

              "success:true：" +
              successTrueCount +
              "件\n" +

              "success:false：" +
              successFalseCount +
              "件\n" +

              "通信失敗：" +
              rejectedCount +
              "件\n\n" +

              "受付の最終件数：" +
              finalCount +
              "件\n" +

              "8-F-2データ：" +
              testData.length +
              "件\n\n" +

              "registrationId：" +
              registrationIds.length +
              "個\n" +

              "異なるregistrationId：" +
              uniqueRegistrationIds.size +
              "個\n\n" +

              "異なるテスト番号：" +
              uniqueIndexes.size +
              "個\n" +

              "最後に確認できた番号：" +
              highestReceivedIndex +
              "\n" +

              "欠落番号：" +
              missingIndexes.length +
              "件\n" +

              (
                missingIndexes.length > 0
                  ? "欠落：" +
                    missingIndexes.join(", ") +
                    "\n"
                  : ""
              ) +

              "重複番号：" +
              duplicateIndexes.length +
              "件\n" +

              (
                duplicateIndexes.length > 0
                  ? "重複：" +
                    duplicateIndexes.join(", ") +
                    "\n"
                  : ""
              ) +

              "\n300件送信完了まで：" +
              sendSeconds +
              "秒\n" +

              "最終確認完了まで：" +
              totalSeconds +
              "秒\n\n" +

              "想定と異なる結果です。\n" +
              "追加操作をせず、" +
              "この結果を確認してください。";
          }


          progress.textContent =
            "進行状況：テスト終了";


          /*
           * --------------------------------
           * 詳細結果
           * --------------------------------
           */
          resultBox.style.display =
            "block";


          resultBox.textContent =
            "【8-F-2集計】\n\n" +

            JSON.stringify(
              {
                totalRequested:
                  TOTAL_COUNT,

                fulfilledCount:
                  fulfilledCount,

                rejectedCount:
                  rejectedCount,

                successTrueCount:
                  successTrueCount,

                successFalseCount:
                  successFalseCount,

                finalCount:
                  finalCount,

                testDataCount:
                  testData.length,

                registrationIdCount:
                  registrationIds.length,

                uniqueRegistrationIdCount:
                  uniqueRegistrationIds.size,

                uniqueTestIndexCount:
                  uniqueIndexes.size,

                highestReceivedIndex:
                  highestReceivedIndex,

                missingIndexes:
                  missingIndexes,

                duplicateIndexes:
                  duplicateIndexes,

                sendSeconds:
                  sendSeconds,

                totalSeconds:
                  totalSeconds
              },
              null,
              2
            ) +

            "\n\n" +
            "【POST応答詳細】\n\n" +

            JSON.stringify(
              responseDetails,
              null,
              2
            ) +

            "\n\n" +
            "【最終受付データ】\n\n" +

            JSON.stringify(
              finalPull,
              null,
              2
            );


        } catch (error) {

          const errorTime =
            performance.now();


          const elapsedSeconds =
            (
              (
                errorTime -
                startTime
              ) /
              1000
            ).toFixed(2);


          progress.textContent =
            "進行状況：エラーで停止";


          runMessage.textContent =
            "テスト8-F-2：処理途中で停止\n\n" +

            "経過時間：" +
            elapsedSeconds +
            "秒\n\n" +

            "エラー内容：\n" +
            String(error) +
            "\n\n" +

            "300件規模では、" +
            "受付側の保存容量などの制限に" +
            "達した可能性もあります。\n\n" +

            "追加操作をせず、" +
            "この結果を確認してください。";


          resultBox.style.display =
            "block";


          resultBox.textContent =
            "処理途中でエラーになりました。\n\n" +
            String(error);
        }

      }
    );

  </script>

</body>

</html>
