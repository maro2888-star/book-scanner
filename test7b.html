<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>実証テスト8-A</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    .description {
      margin-bottom: 24px;
    }

    button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 14px 0;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>実証テスト8-A</h1>

  <div class="description">
    <p>
      司書PCを閉じた状態で、
      複数の登録データを送信するテストです。
    </p>

    <p>
      下の3つのボタンを、
      それぞれ1回ずつ押してください。
    </p>
  </div>


  <button onclick="sendTestData(
    '生徒A',
    '9784000000001',
    'テスト書籍1'
  )">
    生徒A・テスト書籍1を送信
  </button>


  <button onclick="sendTestData(
    '生徒B',
    '9784000000002',
    'テスト書籍2'
  )">
    生徒B・テスト書籍2を送信
  </button>


  <button onclick="sendTestData(
    '生徒C',
    '9784000000003',
    'テスト書籍3'
  )">
    生徒C・テスト書籍3を送信
  </button>


  <div id="result">
    まだ送信していません。
  </div>


  <script>

    const RECEIVER_URL =
      "https://script.google.com/macros/s/AKfycbzwrpenfMoWg_39jjqn102JhJQph90vjldiwVNs9fyrX_8Y6EswcN4jI_ZlotR2Qc3i6Q/exec";

    const SELECTION_KEY =
      "TEST8A-001";


    async function sendTestData(
      userName,
      isbn,
      title
    ) {

      const result =
        document.getElementById("result");


      result.textContent =
        userName + " のデータを送信しています…";


      const data = {

        test:
          "実証テスト8-A",

        selectionKey:
          SELECTION_KEY,

        userName:
          userName,

        isbn:
          isbn,

        title:
          title
      };


      try {

        const response =
          await fetch(
            RECEIVER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(data)
            }
          );


        const responseData =
          await response.json();


        if (responseData.success) {

          result.textContent =
            "送信成功\n\n" +
            "登録者：" + userName + "\n" +
            "ISBN：" + isbn + "\n" +
            "書名：" + title + "\n\n" +
            "受付の現在件数：" +
            responseData.count + "件\n\n" +
            "registrationId：\n" +
            responseData.registrationId;

        } else {

          result.textContent =
            "送信できませんでした。\n\n" +
            responseData.message;
        }


      } catch (error) {

        result.textContent =
          "通信エラーが発生しました。\n\n" +
          String(error);
      }
    }

  </script>

</body>
</html>
