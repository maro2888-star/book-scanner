<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>スマホde選書システム OpenBDデバッグ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px 14px 30px;
      background: #f7f7f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0 8px;
      text-align: center;
      font-size: 21px;
    }

    .description {
      margin: 0 0 14px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 37%;
      height: 26%;
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 8px;
      pointer-events: none;
    }

    .guide-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7px;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }

    .status,
    .book-info,
    .debug-box,
    .note {
      margin-top: 16px;
      padding: 14px;
      background: #fff;
      border-radius: 8px;
    }

    .status {
      text-align: center;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    #result {
      min-height: 34px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    #message {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .success {
      color: #146c2e !important;
    }

    .error {
      color: #b00020 !important;
    }

    .book-info {
      display: none;
    }

    .book-cover-wrap {
      text-align: center;
      margin-bottom: 14px;
    }

    #bookCover {
      display: none;
      max-width: 180px;
      max-height: 260px;
      width: auto;
      height: auto;
    }

    .book-row {
      margin-top: 12px;
    }

    .book-row-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 3px;
    }

    .book-row-value {
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
    }

    button.secondary {
      background: #666;
    }

    .debug-box {
      display: none;
    }

    .debug-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.5;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }

    .note {
      font-size: 13px;
      line-height: 1.6;
      color: #555;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>スマホde選書システム</h1>

    <p class="description">
      本の1段目のバーコードを、白い枠の中に入れてください。
    </p>

    <div class="camera-wrap">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-guide"></div>

      <div class="guide-label">
        1段目のバーコードをこの枠に合わせてください
      </div>

    </div>


    <section class="status">

      <div class="label">
        読み取ったISBN
      </div>

      <div id="result">
        まだありません
      </div>

      <div id="message">
        準備しています…
      </div>

    </section>


    <section id="bookInfo" class="book-info">

      <div class="book-cover-wrap">
        <img id="bookCover" alt="表紙画像">
      </div>

      <div class="book-row">
        <div class="book-row-label">書名</div>
        <div id="bookTitle" class="book-row-value">－</div>
      </div>

      <div class="book-row">
        <div class="book-row-label">出版社</div>
        <div id="bookPublisher" class="book-row-value">－</div>
      </div>

      <div class="book-row">
        <div class="book-row-label">商品コード（ISBN）</div>
        <div id="bookIsbn" class="book-row-value">－</div>
      </div>

      <div class="book-row">
        <div class="book-row-label">本体価格</div>
        <div id="bookPrice" class="book-row-value">－</div>
      </div>

    </section>


    <section id="debugBox" class="debug-box">

      <div class="debug-title">
        OpenBDデバッグ表示
      </div>

      <div class="book-row">
        <div class="book-row-label">summary</div>
        <pre id="debugSummary">－</pre>
      </div>

      <div class="book-row">
        <div class="book-row-label">PublishingDetail</div>
        <pre id="debugPublishingDetail">－</pre>
      </div>

      <div class="book-row">
        <div class="book-row-label">ProductSupply</div>
        <pre id="debugProductSupply">－</pre>
      </div>

    </section>


    <button id="retryOpenBdButton"
            type="button"
            class="secondary"
            style="display:none;">
      もう一度検索
    </button>


    <button id="restartButton"
            type="button"
            style="display:none;">
      次の本を読む
    </button>


    <div class="note">
      ※今回はOpenBDから返されたデータ構造を確認するためのデバッグ版です。
      スプレッドシートへの登録処理はまだ行いません。
    </div>

    <canvas id="canvas"></canvas>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/zxing-wasm/dist/iife/reader/index.js">
  </script>


  <script>
    "use strict";


    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    const context = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const resultElement =
      document.getElementById("result");

    const messageElement =
      document.getElementById("message");

    const restartButton =
      document.getElementById("restartButton");

    const retryOpenBdButton =
      document.getElementById("retryOpenBdButton");

    const bookInfoElement =
      document.getElementById("bookInfo");

    const bookCoverElement =
      document.getElementById("bookCover");

    const bookTitleElement =
      document.getElementById("bookTitle");

    const bookPublisherElement =
      document.getElementById("bookPublisher");

    const bookIsbnElement =
      document.getElementById("bookIsbn");

    const bookPriceElement =
      document.getElementById("bookPrice");

    const debugBox =
      document.getElementById("debugBox");

    const debugSummary =
      document.getElementById("debugSummary");

    const debugPublishingDetail =
      document.getElementById("debugPublishingDetail");

    const debugProductSupply =
      document.getElementById("debugProductSupply");


    let stream = null;
    let scanning = false;
    let decoding = false;
    let animationId = null;

    let lastDecodeTime = 0;
    let currentIsbn = "";

    const DECODE_INTERVAL = 120;


    function setMessage(text, className = "") {

      messageElement.textContent = text;
      messageElement.className = className;
    }


    function normalizeCode(text) {

      return String(text || "").replace(/\D/g, "");
    }


    function isIsbn(code) {

      return (
        /^\d{13}$/.test(code) &&
        (
          code.startsWith("978") ||
          code.startsWith("979")
        )
      );
    }


    function isSecondBarcode(code) {

      return (
        /^\d{13}$/.test(code) &&
        code.startsWith("192")
      );
    }


    function clearBookInfo() {

      bookInfoElement.style.display = "none";
      debugBox.style.display = "none";

      bookCoverElement.style.display = "none";
      bookCoverElement.removeAttribute("src");

      bookTitleElement.textContent = "－";
      bookPublisherElement.textContent = "－";
      bookIsbnElement.textContent = "－";
      bookPriceElement.textContent = "－";

      debugSummary.textContent = "－";
      debugPublishingDetail.textContent = "－";
      debugProductSupply.textContent = "－";

      retryOpenBdButton.style.display = "none";
      restartButton.style.display = "none";
    }


    async function stopCamera() {

      scanning = false;

      if (animationId) {

        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (stream) {

        stream.getTracks().forEach(track => {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;
    }


    async function startCamera() {

      await stopCamera();

      currentIsbn = "";

      resultElement.textContent = "まだありません";

      clearBookInfo();

      setMessage("カメラを起動しています…");

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            audio: false,

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              }
            }
          });


        video.srcObject = stream;

        await video.play();

        scanning = true;

        setMessage(
          "本の1段目のバーコードを白い枠に合わせてください。"
        );

        requestScan();

      } catch (error) {

        console.error(error);

        setMessage(
          "カメラを起動できませんでした。ブラウザのカメラ使用許可を確認してください。",
          "error"
        );
      }
    }


    function requestScan() {

      if (!scanning) {
        return;
      }

      animationId =
        requestAnimationFrame(scanFrame);
    }


    function getTextValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string" ||
        typeof value === "number"
      ) {

        return String(value);
      }


      if (Array.isArray(value)) {

        for (const item of value) {

          const text =
            getTextValue(item);

          if (text) {
            return text;
          }
        }

        return "";
      }


      if (typeof value === "object") {

        const preferredKeys = [
          "content",
          "value",
          "#text",
          "$"
        ];

        for (const key of preferredKeys) {

          if (
            Object.prototype.hasOwnProperty.call(
              value,
              key
            )
          ) {

            const text =
              getTextValue(value[key]);

            if (text) {
              return text;
            }
          }
        }
      }

      return "";
    }


    function findValueByKey(
      object,
      targetKeys
    ) {

      if (
        object === null ||
        object === undefined
      ) {
        return "";
      }


      if (Array.isArray(object)) {

        for (const item of object) {

          const result =
            findValueByKey(
              item,
              targetKeys
            );

          if (result) {
            return result;
          }
        }

        return "";
      }


      if (typeof object !== "object") {
        return "";
      }


      for (const key of targetKeys) {

        if (
          Object.prototype.hasOwnProperty.call(
            object,
            key
          )
        ) {

          const text =
            getTextValue(
              object[key]
            );

          if (text) {
            return text;
          }
        }
      }


      for (const key of Object.keys(object)) {

        const result =
          findValueByKey(
            object[key],
            targetKeys
          );

        if (result) {
          return result;
        }
      }


      return "";
    }


    function getTitleFromOnix(book) {

      try {

        const descriptiveDetail =
          book.onix?.DescriptiveDetail;

        if (!descriptiveDetail) {
          return "";
        }

        return findValueByKey(
          descriptiveDetail,
          [
            "TitleText"
          ]
        );

      } catch (error) {

        console.warn(
          "書名取得:",
          error
        );

        return "";
      }
    }


    function getPublisherFromOnix(book) {

      try {

        const publishingDetail =
          book.onix?.PublishingDetail;

        if (!publishingDetail) {
          return "";
        }


        const imprintName =
          findValueByKey(
            publishingDetail.Imprint,
            [
              "ImprintName"
            ]
          );


        if (imprintName) {
          return imprintName;
        }


        const publisherName =
          findValueByKey(
            publishingDetail.Publisher,
            [
              "PublisherName"
            ]
          );


        if (publisherName) {
          return publisherName;
        }


        return findValueByKey(
          publishingDetail,
          [
            "ImprintName",
            "PublisherName"
          ]
        );


      } catch (error) {

        console.warn(
          "出版社取得:",
          error
        );

        return "";
      }
    }


    function getPriceFromOpenBd(book) {

      try {

        const productSupply =
          book.onix?.ProductSupply;

        if (!productSupply) {
          return null;
        }


        const rawPrice =
          findValueByKey(
            productSupply,
            [
              "PriceAmount"
            ]
          );


        if (!rawPrice) {
          return null;
        }


        const cleaned =
          String(rawPrice)
            .replace(/[^\d.]/g, "");


        if (!cleaned) {
          return null;
        }


        const number =
          Number(cleaned);


        if (
          !Number.isFinite(number) ||
          number <= 0
        ) {
          return null;
        }


        return Math.round(number);


      } catch (error) {

        console.warn(
          "価格取得:",
          error
        );

        return null;
      }
    }


    function safeJson(value) {

      try {

        if (
          value === undefined ||
          value === null
        ) {
          return "データなし";
        }

        return JSON.stringify(
          value,
          null,
          2
        );

      } catch (error) {

        return "JSON表示エラー";
      }
    }


    async function fetchOpenBd(isbn) {

      currentIsbn = isbn;

      retryOpenBdButton.style.display = "none";
      restartButton.style.display = "none";

      setMessage(
        "書誌情報を取得しています…"
      );


      try {

        const url =
          "https://api.openbd.jp/v1/get?isbn=" +
          encodeURIComponent(isbn);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "OpenBD HTTP error: " +
            response.status
          );
        }


        const data =
          await response.json();


        console.log(
          "OpenBD response:",
          data
        );


        if (
          !Array.isArray(data) ||
          data.length === 0 ||
          data[0] === null
        ) {

          showNoBibliographicData(isbn);
          return;
        }


        showBookData(
          data[0],
          isbn
        );


      } catch (error) {

        console.error(
          "OpenBD通信エラー:",
          error
        );

        showCommunicationError();
      }
    }


    function showNoBibliographicData(isbn) {

      bookInfoElement.style.display =
        "none";

      debugBox.style.display =
        "none";


      setMessage(
        "この本の情報を取得できませんでした。本の情報を手入力してください。",
        "error"
      );


      restartButton.style.display =
        "block";
    }


    function showCommunicationError() {

      bookInfoElement.style.display =
        "none";

      debugBox.style.display =
        "none";


      setMessage(
        "書誌情報を取得できませんでした。通信状況を確認して、もう一度お試しください。",
        "error"
      );


      retryOpenBdButton.style.display =
        "block";

      restartButton.style.display =
        "block";
    }


    function showBookData(
      book,
      isbn
    ) {

      const summary =
        book.summary || {};


      const title =
        summary.title ||
        getTitleFromOnix(book) ||
        "取得できませんでした";


      const publisher =
        summary.publisher ||
        getPublisherFromOnix(book) ||
        "取得できませんでした";


      const cover =
        summary.cover || "";


      const price =
        getPriceFromOpenBd(book);


      bookTitleElement.textContent =
        title;


      bookPublisherElement.textContent =
        publisher;


      bookIsbnElement.textContent =
        isbn;


      if (price !== null) {

        bookPriceElement.textContent =
          price + "円";

      } else {

        bookPriceElement.textContent =
          "価格情報なし";
      }


      if (cover) {

        bookCoverElement.src =
          cover;

        bookCoverElement.style.display =
          "inline-block";

      } else {

        bookCoverElement.style.display =
          "none";
      }


      bookInfoElement.style.display =
        "block";


      /*
       * デバッグ表示
       */
      debugSummary.textContent =
        safeJson(
          book.summary
        );


      debugPublishingDetail.textContent =
        safeJson(
          book.onix?.PublishingDetail
        );


      debugProductSupply.textContent =
        safeJson(
          book.onix?.ProductSupply
        );


      debugBox.style.display =
        "block";


      setMessage(
        "書誌情報を取得しました。",
        "success"
      );


      restartButton.style.display =
        "block";
    }


    async function scanFrame(timestamp) {

      if (!scanning) {
        return;
      }


      if (
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        requestScan();
        return;
      }


      if (
        decoding ||
        timestamp - lastDecodeTime < DECODE_INTERVAL
      ) {

        requestScan();
        return;
      }


      lastDecodeTime = timestamp;
      decoding = true;


      try {

        const sourceWidth =
          video.videoWidth;

        const sourceHeight =
          video.videoHeight;


        const cropWidth =
          Math.floor(
            sourceWidth * 0.90
          );

        const cropHeight =
          Math.floor(
            sourceHeight * 0.30
          );

        const cropX =
          Math.floor(
            (sourceWidth - cropWidth) / 2
          );

        const cropY =
          Math.floor(
            (sourceHeight - cropHeight) / 2
          );


        const targetWidth = 1200;

        const scale =
          targetWidth / cropWidth;

        const targetHeight =
          Math.max(
            180,
            Math.floor(
              cropHeight * scale
            )
          );


        canvas.width =
          targetWidth;

        canvas.height =
          targetHeight;


        context.drawImage(

          video,

          cropX,
          cropY,
          cropWidth,
          cropHeight,

          0,
          0,
          targetWidth,
          targetHeight
        );


        const imageData =
          context.getImageData(
            0,
            0,
            targetWidth,
            targetHeight
          );


        const results =
          await ZXingWASM.readBarcodes(

            imageData,

            {
              formats: ["EAN13"],
              tryHarder: true,
              maxNumberOfSymbols: 1
            }
          );


        if (
          results &&
          results.length > 0
        ) {

          const code =
            normalizeCode(
              results[0].text
            );


          if (
            isSecondBarcode(code)
          ) {

            setMessage(
              "2段目のバーコードを読み取りました。1段目のバーコードを読み直してください。",
              "error"
            );


          } else if (
            isIsbn(code)
          ) {

            resultElement.textContent =
              code;


            setMessage(
              "読み取り成功",
              "success"
            );


            await stopCamera();

            decoding = false;


            await fetchOpenBd(code);

            return;


          } else {

            setMessage(
              "ISBNではないバーコードを読み取りました。",
              "error"
            );
          }
        }


      } catch (error) {

        console.debug(
          "decode:",
          error
        );

      } finally {

        decoding = false;
      }


      requestScan();
    }


    retryOpenBdButton.addEventListener(
      "click",
      async function() {

        if (!currentIsbn) {
          return;
        }

        await fetchOpenBd(
          currentIsbn
        );
      }
    );


    restartButton.addEventListener(
      "click",
      async function() {

        await startCamera();
      }
    );


    window.addEventListener(
      "load",
      async function() {

        if (
          typeof ZXingWASM === "undefined" ||
          typeof ZXingWASM.readBarcodes !==
            "function"
        ) {

          setMessage(
            "バーコード読み取りプログラムを読み込めませんでした。",
            "error"
          );

          return;
        }


        await startCamera();
      }
    );


    window.addEventListener(
      "pagehide",
      function() {

        stopCamera();
      }
    );

  </script>

</body>
</html>
