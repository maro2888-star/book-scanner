<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>スマホde選書システム No.20確認版</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px 14px 30px;
      background: #f7f7f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0 8px;
      text-align: center;
      font-size: 21px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .description {
      margin: 0 0 14px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 37%;
      height: 26%;
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 8px;
      pointer-events: none;
    }

    .guide-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7px;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }

    .card {
      margin-top: 16px;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
    }

    .status {
      text-align: center;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    #result {
      min-height: 34px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    #message {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .success {
      color: #146c2e !important;
    }

    .error {
      color: #b00020 !important;
    }

    .info-row {
      margin-top: 14px;
    }

    .info-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
      min-height: 26px;
    }

    .empty-value {
      color: #999;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 16px;
    }

    button.secondary {
      background: #666;
    }

    button.light {
      background: #ddd;
      color: #222;
    }

    button.danger {
      background: #8b2d2d;
    }

    .manual-button {
      margin-top: 14px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .form-row {
      margin-top: 14px;
    }

    .form-row label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #555;
    }

    .required {
      color: #b00020;
      font-size: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #888;
      border-color: #888;
    }

    .price-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price-input-wrap input {
      flex: 1;
    }

    .yen-label {
      white-space: nowrap;
      font-size: 16px;
    }

    .note {
      margin-top: 16px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #555;
    }

    .temporary-result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #eef7ef;
      color: #245c2c;
      font-size: 14px;
      line-height: 1.6;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>スマホde選書システム</h1>


    <!-- =========================================
         1. バーコード読み取り画面
    ========================================== -->
    <section id="scannerScreen" class="screen active">

      <p class="description">
        本の1段目のバーコードを、白い枠の中に入れてください。
      </p>

      <div class="camera-wrap">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <div class="scan-guide"></div>

        <div class="guide-label">
          1段目のバーコードをこの枠に合わせてください
        </div>

      </div>


      <section class="card status">

        <div class="label">
          読み取ったISBN
        </div>

        <div id="result">
          まだありません
        </div>

        <div id="message">
          準備しています…
        </div>

      </section>


      <button
        id="manualEntryButton"
        type="button"
        class="secondary manual-button">
        バーコードがない・読み取れない本を登録する
      </button>

    </section>


    <!-- =========================================
         2. 書誌確認画面
    ========================================== -->
    <section id="confirmScreen" class="screen">

      <section class="card">

        <h2>本の情報を確認してください</h2>


        <div class="info-row">
          <div class="info-label">書名</div>
          <div id="confirmTitle"
               class="info-value">
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">著者名</div>
          <div id="confirmAuthor"
               class="info-value">
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">出版社</div>
          <div id="confirmPublisher"
               class="info-value">
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">商品コード（ISBN）</div>
          <div id="confirmIsbn"
               class="info-value">
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">本体価格</div>
          <div id="confirmPrice"
               class="info-value">
          </div>
        </div>


        <div class="button-row">

          <button
            id="confirmRegisterButton"
            type="button">
            登録
          </button>

          <button
            id="confirmCancelButton"
            type="button"
            class="light">
            キャンセル
          </button>

        </div>


        <div id="confirmTemporaryResult"
             class="temporary-result"
             style="display:none;">
        </div>

      </section>

    </section>


    <!-- =========================================
         3. 手入力画面
    ========================================== -->
    <section id="manualScreen" class="screen">

      <section class="card">

        <h2>本の情報を入力してください</h2>


        <div class="form-row">

          <label for="manualIsbn">
            商品コード（ISBN）
          </label>

          <input
            id="manualIsbn"
            type="text"
            inputmode="numeric"
            maxlength="13"
            autocomplete="off">

        </div>


        <div class="form-row">

          <label for="manualTitle">
            書名
            <span class="required">
              必須
            </span>
          </label>

          <input
            id="manualTitle"
            type="text"
            autocomplete="off">

        </div>


        <div class="form-row">

          <label for="manualAuthor">
            著者名
          </label>

          <input
            id="manualAuthor"
            type="text"
            autocomplete="off">

        </div>


        <div class="form-row">

          <label for="manualPublisher">
            出版社
          </label>

          <input
            id="manualPublisher"
            type="text"
            autocomplete="off">

        </div>


        <div class="form-row">

          <label for="manualPrice">
            本体価格
          </label>

          <div class="price-input-wrap">

            <input
              id="manualPrice"
              type="text"
              inputmode="numeric"
              autocomplete="off">

            <span class="yen-label">
              円
            </span>

          </div>

        </div>


        <div class="button-row">

          <button
            id="manualRegisterButton"
            type="button">
            登録
          </button>

          <button
            id="manualCancelButton"
            type="button"
            class="light">
            キャンセル
          </button>

        </div>


        <div id="manualTemporaryResult"
             class="temporary-result"
             style="display:none;">
        </div>

      </section>

    </section>


    <!-- =========================================
         4. 通信エラー画面
    ========================================== -->
    <section id="communicationErrorScreen"
             class="screen">

      <section class="card">

        <h2>書誌情報を取得できませんでした</h2>

        <p>
          通信状況を確認して、
          もう一度お試しください。
        </p>


        <button
          id="retryOpenBdButton"
          type="button">
          もう一度検索
        </button>


        <button
          id="communicationManualButton"
          type="button"
          class="secondary manual-button">
          手入力する
        </button>


        <button
          id="communicationCancelButton"
          type="button"
          class="light manual-button">
          キャンセル
        </button>

      </section>

    </section>


    <div class="note">
      ※今回はNo.20「書誌確認画面・手入力画面」の確認版です。
      スプレッドシートへの保存はまだ行いません。
    </div>


    <canvas id="canvas"></canvas>

  </main>


  <!-- ZXing-WASM -->
  <script
    src="https://cdn.jsdelivr.net/npm/zxing-wasm/dist/iife/reader/index.js">
  </script>


  <script>
    "use strict";


    /* =========================================
       DOM
    ========================================== */

    const scannerScreen =
      document.getElementById("scannerScreen");

    const confirmScreen =
      document.getElementById("confirmScreen");

    const manualScreen =
      document.getElementById("manualScreen");

    const communicationErrorScreen =
      document.getElementById(
        "communicationErrorScreen"
      );


    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const context =
      canvas.getContext("2d", {
        willReadFrequently: true
      });


    const resultElement =
      document.getElementById("result");

    const messageElement =
      document.getElementById("message");


    const manualEntryButton =
      document.getElementById(
        "manualEntryButton"
      );


    const confirmTitle =
      document.getElementById("confirmTitle");

    const confirmAuthor =
      document.getElementById("confirmAuthor");

    const confirmPublisher =
      document.getElementById(
        "confirmPublisher"
      );

    const confirmIsbn =
      document.getElementById("confirmIsbn");

    const confirmPrice =
      document.getElementById("confirmPrice");

    const confirmRegisterButton =
      document.getElementById(
        "confirmRegisterButton"
      );

    const confirmCancelButton =
      document.getElementById(
        "confirmCancelButton"
      );

    const confirmTemporaryResult =
      document.getElementById(
        "confirmTemporaryResult"
      );


    const manualIsbn =
      document.getElementById("manualIsbn");

    const manualTitle =
      document.getElementById("manualTitle");

    const manualAuthor =
      document.getElementById("manualAuthor");

    const manualPublisher =
      document.getElementById(
        "manualPublisher"
      );

    const manualPrice =
      document.getElementById("manualPrice");

    const manualRegisterButton =
      document.getElementById(
        "manualRegisterButton"
      );

    const manualCancelButton =
      document.getElementById(
        "manualCancelButton"
      );

    const manualTemporaryResult =
      document.getElementById(
        "manualTemporaryResult"
      );


    const retryOpenBdButton =
      document.getElementById(
        "retryOpenBdButton"
      );

    const communicationManualButton =
      document.getElementById(
        "communicationManualButton"
      );

    const communicationCancelButton =
      document.getElementById(
        "communicationCancelButton"
      );


    /* =========================================
       状態
    ========================================== */

    let stream = null;

    let scanning = false;
    let decoding = false;
    let animationId = null;

    let lastDecodeTime = 0;

    let currentIsbn = "";

    let currentBook = null;

    const DECODE_INTERVAL = 120;


    /* =========================================
       共通
    ========================================== */

    function showScreen(screen) {

      scannerScreen.classList.remove("active");
      confirmScreen.classList.remove("active");
      manualScreen.classList.remove("active");
      communicationErrorScreen.classList.remove(
        "active"
      );

      screen.classList.add("active");
    }


    function setMessage(
      text,
      className = ""
    ) {

      messageElement.textContent = text;
      messageElement.className = className;
    }


    function normalizeCode(text) {

      return String(text || "")
        .replace(/\D/g, "");
    }


    function isIsbn(code) {

      return (
        /^\d{13}$/.test(code) &&
        (
          code.startsWith("978") ||
          code.startsWith("979")
        )
      );
    }


    function isSecondBarcode(code) {

      return (
        /^\d{13}$/.test(code) &&
        code.startsWith("192")
      );
    }


    function setDisplayValue(
      element,
      value,
      emptyText = "未取得"
    ) {

      const text =
        String(value || "").trim();

      if (text) {

        element.textContent = text;
        element.classList.remove(
          "empty-value"
        );

      } else {

        element.textContent = emptyText;
        element.classList.add(
          "empty-value"
        );
      }
    }


    /* =========================================
       カメラ
    ========================================== */

    async function stopCamera() {

      scanning = false;

      if (animationId) {

        cancelAnimationFrame(
          animationId
        );

        animationId = null;
      }


      if (stream) {

        stream
          .getTracks()
          .forEach(track => {

            track.stop();

          });

        stream = null;
      }


      video.srcObject = null;
    }


    async function startCamera() {

      await stopCamera();

      currentIsbn = "";
      currentBook = null;

      resultElement.textContent =
        "まだありません";

      setMessage(
        "カメラを起動しています…"
      );

      showScreen(scannerScreen);


      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              audio: false,

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              }

            });


        video.srcObject = stream;

        await video.play();

        scanning = true;


        setMessage(
          "本の1段目のバーコードを白い枠に合わせてください。"
        );


        requestScan();


      } catch (error) {

        console.error(
          "カメラ起動エラー:",
          error
        );


        setMessage(
          "カメラを起動できませんでした。ブラウザのカメラ使用許可を確認してください。",
          "error"
        );
      }
    }


    function requestScan() {

      if (!scanning) {
        return;
      }

      animationId =
        requestAnimationFrame(
          scanFrame
        );
    }


    /* =========================================
       OpenBD値取得
    ========================================== */

    function getTextValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string" ||
        typeof value === "number"
      ) {

        return String(value);
      }


      if (Array.isArray(value)) {

        for (const item of value) {

          const text =
            getTextValue(item);

          if (text) {
            return text;
          }
        }

        return "";
      }


      if (typeof value === "object") {

        const preferredKeys = [
          "content",
          "value",
          "#text",
          "$"
        ];


        for (
          const key of preferredKeys
        ) {

          if (
            Object.prototype
              .hasOwnProperty
              .call(
                value,
                key
              )
          ) {

            const text =
              getTextValue(
                value[key]
              );

            if (text) {
              return text;
            }
          }
        }
      }


      return "";
    }


    function findValueByKey(
      object,
      targetKeys
    ) {

      if (
        object === null ||
        object === undefined
      ) {
        return "";
      }


      if (Array.isArray(object)) {

        for (const item of object) {

          const result =
            findValueByKey(
              item,
              targetKeys
            );

          if (result) {
            return result;
          }
        }

        return "";
      }


      if (
        typeof object !== "object"
      ) {
        return "";
      }


      for (
        const key of targetKeys
      ) {

        if (
          Object.prototype
            .hasOwnProperty
            .call(
              object,
              key
            )
        ) {

          const text =
            getTextValue(
              object[key]
            );

          if (text) {
            return text;
          }
        }
      }


      for (
        const key of
          Object.keys(object)
      ) {

        const result =
          findValueByKey(
            object[key],
            targetKeys
          );

        if (result) {
          return result;
        }
      }


      return "";
    }


    function getPublisherFromOnix(
      book
    ) {

      const detail =
        book.onix
          ?.PublishingDetail;

      if (!detail) {
        return "";
      }


      const imprint =
        findValueByKey(
          detail.Imprint,
          [
            "ImprintName"
          ]
        );


      if (imprint) {
        return imprint;
      }


      return findValueByKey(
        detail,
        [
          "PublisherName"
        ]
      );
    }


    function getPriceFromOpenBd(
      book
    ) {

      const productSupply =
        book.onix
          ?.ProductSupply;

      if (!productSupply) {
        return "";
      }


      const rawPrice =
        findValueByKey(
          productSupply,
          [
            "PriceAmount"
          ]
        );


      if (!rawPrice) {
        return "";
      }


      const cleaned =
        String(rawPrice)
          .replace(/[^\d.]/g, "");


      const number =
        Number(cleaned);


      if (
        !Number.isFinite(number) ||
        number <= 0
      ) {
        return "";
      }


      return String(
        Math.round(number)
      );
    }


    function createBookData(
      book,
      isbn
    ) {

      const summary =
        book.summary || {};


      return {

        isbn: isbn,

        title:
          String(
            summary.title || ""
          ).trim(),

        author:
          String(
            summary.author || ""
          ).trim(),

        publisher:
          String(
            summary.publisher ||
            getPublisherFromOnix(
              book
            ) ||
            ""
          ).trim(),

        price:
          getPriceFromOpenBd(
            book
          )

      };
    }


    /* =========================================
       OpenBD検索
    ========================================== */

    async function fetchOpenBd(isbn) {

      currentIsbn = isbn;


      try {

        const url =
          "https://api.openbd.jp/v1/get?isbn=" +
          encodeURIComponent(isbn);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "OpenBD HTTP error: " +
            response.status
          );
        }


        const data =
          await response.json();


        if (
          !Array.isArray(data) ||
          data.length === 0 ||
          data[0] === null
        ) {

          openManualScreen(
            isbn
          );

          return;
        }


        currentBook =
          createBookData(
            data[0],
            isbn
          );


        showConfirmScreen(
          currentBook
        );


      } catch (error) {

        console.error(
          "OpenBD通信エラー:",
          error
        );


        showScreen(
          communicationErrorScreen
        );
      }
    }


    /* =========================================
       書誌確認画面
    ========================================== */

    function showConfirmScreen(book) {

      setDisplayValue(
        confirmTitle,
        book.title,
        "未取得"
      );

      setDisplayValue(
        confirmAuthor,
        book.author,
        ""
      );

      setDisplayValue(
        confirmPublisher,
        book.publisher,
        ""
      );

      setDisplayValue(
        confirmIsbn,
        book.isbn,
        ""
      );


      if (book.price) {

        setDisplayValue(
          confirmPrice,
          book.price + "円",
          ""
        );

      } else {

        setDisplayValue(
          confirmPrice,
          "",
          ""
        );
      }


      confirmTemporaryResult
        .style.display =
        "none";


      showScreen(
        confirmScreen
      );
    }


    /* =========================================
       手入力画面
    ========================================== */

    function openManualScreen(
      isbn = ""
    ) {

      manualIsbn.value =
        isbn;

      manualTitle.value =
        "";

      manualAuthor.value =
        "";

      manualPublisher.value =
        "";

      manualPrice.value =
        "";

      manualTemporaryResult
        .style.display =
        "none";


      showScreen(
        manualScreen
      );


      setTimeout(
        function() {

          manualTitle.focus();

        },
        100
      );
    }


    function getManualBookData() {

      return {

        isbn:
          normalizeCode(
            manualIsbn.value
          ),

        title:
          manualTitle.value
            .trim(),

        author:
          manualAuthor.value
            .trim(),

        publisher:
          manualPublisher.value
            .trim(),

        price:
          manualPrice.value
            .replace(/\D/g, "")

      };
    }


    /* =========================================
       スキャン
    ========================================== */

    async function scanFrame(timestamp) {

      if (!scanning) {
        return;
      }


      if (
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        requestScan();
        return;
      }


      if (
        decoding ||
        timestamp -
          lastDecodeTime <
          DECODE_INTERVAL
      ) {

        requestScan();
        return;
      }


      lastDecodeTime =
        timestamp;

      decoding = true;


      try {

        const sourceWidth =
          video.videoWidth;

        const sourceHeight =
          video.videoHeight;


        const cropWidth =
          Math.floor(
            sourceWidth * 0.90
          );

        const cropHeight =
          Math.floor(
            sourceHeight * 0.30
          );

        const cropX =
          Math.floor(
            (
              sourceWidth -
              cropWidth
            ) / 2
          );

        const cropY =
          Math.floor(
            (
              sourceHeight -
              cropHeight
            ) / 2
          );


        const targetWidth =
          1200;


        const scale =
          targetWidth /
          cropWidth;


        const targetHeight =
          Math.max(
            180,
            Math.floor(
              cropHeight *
              scale
            )
          );


        canvas.width =
          targetWidth;

        canvas.height =
          targetHeight;


        context.drawImage(

          video,

          cropX,
          cropY,
          cropWidth,
          cropHeight,

          0,
          0,
          targetWidth,
          targetHeight

        );


        const imageData =
          context.getImageData(

            0,
            0,
            targetWidth,
            targetHeight

          );


        const results =
          await ZXingWASM
            .readBarcodes(

              imageData,

              {
                formats: [
                  "EAN13"
                ],
                tryHarder: true,
                maxNumberOfSymbols: 1
              }

            );


        if (
          results &&
          results.length > 0
        ) {

          const code =
            normalizeCode(
              results[0].text
            );


          if (
            isSecondBarcode(code)
          ) {

            setMessage(
              "2段目のバーコードを読み取りました。1段目のバーコードを読み直してください。",
              "error"
            );


          } else if (
            isIsbn(code)
          ) {

            resultElement
              .textContent =
              code;


            setMessage(
              "読み取り成功",
              "success"
            );


            await stopCamera();


            decoding = false;


            await fetchOpenBd(
              code
            );


            return;


          } else {

            setMessage(
              "ISBNではないバーコードを読み取りました。",
              "error"
            );
          }
        }


      } catch (error) {

        console.debug(
          "decode:",
          error
        );

      } finally {

        decoding = false;
      }


      requestScan();
    }


    /* =========================================
       ボタン
    ========================================== */

    manualEntryButton
      .addEventListener(
        "click",
        async function() {

          await stopCamera();

          openManualScreen();

        }
      );


    confirmCancelButton
      .addEventListener(
        "click",
        async function() {

          await startCamera();

        }
      );


    confirmRegisterButton
      .addEventListener(
        "click",
        async function() {

          /*
           * No.20では保存しない。
           * 登録内容が確定できたことだけ確認する。
           */

          confirmTemporaryResult
            .textContent =
            "登録内容を確認しました。※スプレッドシート保存はNo.21で接続します。";


          confirmTemporaryResult
            .style.display =
            "block";


          setTimeout(
            async function() {

              await startCamera();

            },
            1000
          );

        }
      );


    manualCancelButton
      .addEventListener(
        "click",
        async function() {

          await startCamera();

        }
      );


    manualRegisterButton
      .addEventListener(
        "click",
        async function() {

          const book =
            getManualBookData();


          if (!book.title) {

            manualTemporaryResult
              .textContent =
              "書名を入力してください。";

            manualTemporaryResult
              .style.display =
              "block";

            manualTitle.focus();

            return;
          }


          /*
           * ISBNが入力されている場合のみ
           * 13桁の978/979を確認。
           */
          if (
            book.isbn &&
            !isIsbn(book.isbn)
          ) {

            manualTemporaryResult
              .textContent =
              "ISBNを入力する場合は、978または979で始まる13桁で入力してください。";

            manualTemporaryResult
              .style.display =
              "block";

            manualIsbn.focus();

            return;
          }


          manualTemporaryResult
            .textContent =
            "登録内容を確認しました。※スプレッドシート保存はNo.21で接続します。";


          manualTemporaryResult
            .style.display =
            "block";


          setTimeout(
            async function() {

              await startCamera();

            },
            1000
          );

        }
      );


    manualPrice
      .addEventListener(
        "input",
        function() {

          manualPrice.value =
            manualPrice.value
              .replace(/\D/g, "");

        }
      );


    manualIsbn
      .addEventListener(
        "input",
        function() {

          manualIsbn.value =
            manualIsbn.value
              .replace(/\D/g, "")
              .slice(0, 13);

        }
      );


    retryOpenBdButton
      .addEventListener(
        "click",
        async function() {

          if (!currentIsbn) {
            return;
          }


          await fetchOpenBd(
            currentIsbn
          );

        }
      );


    communicationManualButton
      .addEventListener(
        "click",
        function() {

          openManualScreen(
            currentIsbn
          );

        }
      );


    communicationCancelButton
      .addEventListener(
        "click",
        async function() {

          await startCamera();

        }
      );


    /* =========================================
       起動
    ========================================== */

    window.addEventListener(
      "load",
      async function() {

        if (
          typeof ZXingWASM ===
            "undefined" ||
          typeof ZXingWASM
            .readBarcodes !==
            "function"
        ) {

          setMessage(
            "バーコード読み取りプログラムを読み込めませんでした。",
            "error"
          );

          return;
        }


        await startCamera();
      }
    );


    window.addEventListener(
      "pagehide",
      function() {

        stopCamera();

      }
    );

  </script>

</body>
</html>
