<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-size: 21px;
    }

      margin: 0 0 14px;
      font-size: 20px;
    }

    .description {
      margin: 0 0 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

      width: 100%;
      height: 270px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 29%;
      height: 34%;

      border-radius: 8px;
      pointer-events: none;
    }

    .guide-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }

    .card {
      margin-top: 12px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 8px;
    }

    .status {
      text-align: center;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    #result {
      min-height: 32px;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    #message {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
      color: #555;
    }

    .success {
      color: #146c2e !important;
    }

    .error {
      color: #b00020 !important;
    }

    .info-row {
      margin-top: 14px;
    }

    .info-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .info-value {
      min-height: 26px;
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
    }

    .empty-value {
      color: #999;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 16px;
    }

    button.secondary {
      background: #666;
    }

    button.light {
      background: #ddd;
      color: #222;
    }

    button:disabled {

    }

    .manual-button,

    .screen {

    .form-row {

    }

      font-size: 13px;
      color: #555;

    .required {

    }

    input {

      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font-size: 16px;

  <script>
    "use strict";

    /* =========================================
       状態
    ========================================== */

    let stream = null;

    let scanning = false;
    let decoding = false;
    let animationId = null;

    let lastDecodeTime = 0;

    let currentIsbn = "";
    let currentBook = null;

    let cameraStartGeneration = 0;
    let cameraStartTimer = null;

    let saving = false;


    const DECODE_INTERVAL = 120;
    const CAMERA_START_TIMEOUT = 10000;


    /* =========================================
       共通
    ========================================== */

    function showScreen(screen) {

      scannerScreen.classList.remove("active");
      confirmScreen.classList.remove("active");
      manualScreen.classList.remove("active");

      communicationErrorScreen
        .classList.remove("active");

      screen.classList.add("active");
    }


    function setMessage(
      text,
      className = ""
    ) {

      messageElement.textContent = text;
      messageElement.className = className;
    }


    function normalizeCode(text) {

      return String(text || "")
        .replace(/\D/g, "");
    }


    function isIsbn(code) {

      return (
        /^\d{13}$/.test(code) &&
        (
          code.startsWith("978") ||
          code.startsWith("979")
        )
      );
    }


    function isSecondBarcode(code) {

      return (
        /^\d{13}$/.test(code) &&
        code.startsWith("192")
      );
    }


    function setDisplayValue(
      element,
      value,
      emptyText = ""
    ) {

      const text =
        String(value || "").trim();


      if (text) {

        element.textContent = text;

        element.classList.remove(
          "empty-value"
        );

      } else {

        element.textContent = emptyText;

        element.classList.add(
          "empty-value"
        );
      }
    }


    function clearCameraStartTimer() {

      if (cameraStartTimer) {

        clearTimeout(cameraStartTimer);

        cameraStartTimer = null;
      }
    }


    function showResultBox(
      element,
      text,
      isError = false
    ) {

      element.textContent = text;

      element.style.display = "block";

      if (isError) {
        element.classList.add(
          "error-result"
        );
      } else {
        element.classList.remove(
          "error-result"

      }
    }

      element.style.display = "none";

      element.classList.remove(
        "error-result"
      );
    }


    /* =========================================
       No.21 スプレッドシート保存
    ========================================== */

    async function saveBook(book) {

      const payload = {
        registrantName:
          TEST_REGISTRANT_NAME,

        isbn:
          book.isbn || "",

        publisher:
          book.publisher || "",

        title:
          book.title || "",

        author:
          book.author || "",

        price:
          book.price || ""
      };


      const response =
        await fetch(
          GAS_WEB_APP_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload)
          }
        );


      if (!response.ok) {

        throw new Error(
          "保存通信エラー: " +
          response.status
        );
      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.message ||
          "保存に失敗しました。"
        );
      }


      return result;
    }


    /* =========================================
       カメラ
    ========================================== */

    async function stopCamera() {

      scanning = false;


      if (animationId) {

        cancelAnimationFrame(
          animationId
        );

        animationId = null;
      }


      if (stream) {

        stream
          .getTracks()
          .forEach(track => {
            track.stop();
          });

        stream = null;
      }


      video.srcObject = null;
    }


    async function startCamera() {

      cameraStartGeneration++;

      const thisGeneration =
        cameraStartGeneration;


      clearCameraStartTimer();

      await stopCamera();


      currentIsbn = "";
      currentBook = null;


      resultElement.textContent =
        "まだありません";


      manualEntryButton.style.display =
        "block";

      cameraRetryButton.style.display =
        "none";


      setMessage(
        "カメラを起動しています…"
      );


      showScreen(scannerScreen);


      cameraStartTimer =
        setTimeout(
          function() {

            if (
              thisGeneration ===
                cameraStartGeneration &&
              !scanning
            ) {

              setMessage(
                "カメラの起動に時間がかかっています。下のボタンからもう一度お試しください。",
                "error"
              );

              cameraRetryButton
                .style.display =
                "block";
            }

          },
          CAMERA_START_TIMEOUT
        );


      try {

        const newStream =
          await navigator.mediaDevices
            .getUserMedia({

              audio: false,

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              }

            });


        if (
          thisGeneration !==
          cameraStartGeneration
        ) {

          newStream
            .getTracks()
            .forEach(track => {
              track.stop();
            });

          return;
        }


        stream = newStream;

        video.srcObject = stream;

        await video.play();


        if (
          thisGeneration !==
          cameraStartGeneration
        ) {

          await stopCamera();
          return;
        }


        scanning = true;


        clearCameraStartTimer();

        cameraRetryButton
          .style.display =
          "none";


        setMessage(
          "本の1段目のバーコードを白い枠に合わせてください。"
        );


        requestScan();


      } catch (error) {

        if (
          thisGeneration !==
          cameraStartGeneration
        ) {
          return;
        }


        clearCameraStartTimer();


        console.error(
          "カメラ起動エラー:",
          error
        );


        setMessage(
          "カメラを起動できませんでした。ブラウザのカメラ使用許可を確認するか、もう一度お試しください。",
          "error"
        );


        cameraRetryButton
          .style.display =
          "block";
      }
    }


    function requestScan() {

      if (!scanning) {
        return;
      }


      animationId =
        requestAnimationFrame(
          scanFrame
        );
    }


    /* =========================================
       OpenBDデータ取得
    ========================================== */

    function getTextValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string" ||
        typeof value === "number"
      ) {

        return String(value);
      }


      if (Array.isArray(value)) {

        for (const item of value) {

          const text =
            getTextValue(item);

          if (text) {
            return text;
          }
        }

        return "";
      }


      if (typeof value === "object") {

        const preferredKeys = [
          "content",
          "value",
          "#text",
          "$"
        ];


        for (
          const key of preferredKeys
        ) {

          if (
            Object.prototype
              .hasOwnProperty
              .call(value, key)
          ) {

            const text =
              getTextValue(
                value[key]
              );

            if (text) {
              return text;
            }
          }
        }
      }


      return "";
    }


    function findValueByKey(
      object,
      targetKeys
    ) {

      if (
        object === null ||
        object === undefined
      ) {
        return "";
      }


      if (Array.isArray(object)) {

        for (const item of object) {

          const result =
            findValueByKey(
              item,
              targetKeys
            );

          if (result) {
            return result;
          }
        }

        return "";
      }


      if (
        typeof object !== "object"
      ) {
        return "";
      }


      for (const key of targetKeys) {

        if (
          Object.prototype
            .hasOwnProperty
            .call(object, key)
        ) {

          const text =
            getTextValue(
              object[key]
            );

          if (text) {
            return text;
          }
        }
      }


      for (
        const key of
          Object.keys(object)
      ) {

        const result =
          findValueByKey(
            object[key],
            targetKeys
          );

        if (result) {
          return result;
        }
      }


      return "";
    }


    function getPublisherFromOnix(
      book
    ) {

      const detail =
        book.onix
          ?.PublishingDetail;


      if (!detail) {
        return "";
      }


      const imprint =
        findValueByKey(
          detail.Imprint,
          ["ImprintName"]
        );


      if (imprint) {
        return imprint;
      }


      return findValueByKey(
        detail,
        ["PublisherName"]
      );
    }


    function getPriceFromOpenBd(
      book
    ) {

      const productSupply =
        book.onix
          ?.ProductSupply;


      if (!productSupply) {
        return "";
      }


      const rawPrice =
        findValueByKey(
          productSupply,
          ["PriceAmount"]
        );


      if (!rawPrice) {
        return "";
      }


      const cleaned =
        String(rawPrice)
          .replace(
            /[^\d.]/g,
            ""
          );


      const number =
        Number(cleaned);


      if (
        !Number.isFinite(number) ||
        number <= 0
      ) {
        return "";
      }


      return String(
        Math.round(number)
      );
    }


    function createBookData(
      book,
      isbn
    ) {

      const summary =
        book.summary || {};


      return {

        isbn: isbn,

        title:
          String(
            summary.title || ""
          ).trim(),

        author:
          String(
            summary.author || ""
          ).trim(),

        publisher:
          String(
            summary.publisher ||
            getPublisherFromOnix(book) ||
            ""
          ).trim(),

        price:
          getPriceFromOpenBd(book)

      };
    }


    /* =========================================

    async function fetchOpenBd(isbn) {

      currentIsbn = isbn;


      try {

        const url =
          "https://api.openbd.jp/v1/get?isbn=" +
          encodeURIComponent(isbn);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "OpenBD HTTP error: " +
            response.status
          );
        }


        const data =
          await response.json();


        if (
          !Array.isArray(data) ||
          data.length === 0 ||
          data[0] === null
        ) {

          openManualScreen(isbn);

          return;
        }


        currentBook =
          createBookData(
            data[0],
            isbn
          );


        showConfirmScreen(
          currentBook
        );


      } catch (error) {

        console.error(
          "OpenBD通信エラー:",
          error
        );


        showScreen(
          communicationErrorScreen
        );
      }
    }


    /* =========================================
       書誌確認画面
    ========================================== */

    function showConfirmScreen(book) {

      setDisplayValue(
        confirmTitle,
        book.title
      );

      setDisplayValue(
        confirmAuthor,
        book.author
      );

      setDisplayValue(
        confirmPublisher,
        book.publisher
      );

      setDisplayValue(
        confirmIsbn,
        book.isbn
      );


      if (book.price) {

        setDisplayValue(
          confirmPrice,
          book.price + "円"
        );

      } else {

        setDisplayValue(
          confirmPrice,
          ""
        );
      }


      hideResultBox(
        confirmTemporaryResult
      );


      confirmRegisterButton.disabled =
        false;

      confirmCancelButton.disabled =
        false;


      showScreen(confirmScreen);
    }


    /* =========================================
       手入力画面
    ========================================== */

    function openManualScreen(
      isbn = ""
    ) {

      manualIsbn.value = isbn;
      manualTitle.value = "";
      manualAuthor.value = "";
      manualPublisher.value = "";
      manualPrice.value = "";


      hideResultBox(
        manualTemporaryResult
      );


      manualRegisterButton.disabled =
        false;

      manualCancelButton.disabled =
        false;


      showScreen(manualScreen);


      setTimeout(
        function() {
          manualTitle.focus();
        },
        100
      );
    }


    function getManualBookData() {

      return {

        isbn:
          normalizeCode(
            manualIsbn.value
          ),

        title:
          manualTitle.value.trim(),

        author:
          manualAuthor.value.trim(),

        publisher:
          manualPublisher.value.trim(),

        price:
          manualPrice.value
            .replace(/\D/g, "")

      };
    }


    /* =========================================
       スキャン
    ========================================== */

    async function scanFrame(timestamp) {

      if (!scanning) {
        return;
      }


      if (
        video.readyState < 2 ||
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        requestScan();
        return;
      }


      if (
        decoding ||
        timestamp -
          lastDecodeTime <
          DECODE_INTERVAL
      ) {

        requestScan();
        return;
      }


      lastDecodeTime = timestamp;
      decoding = true;


      try {

        /*
         * No.20で実証済みの
         * ZXing-WASM読み取り部分。
         */

        const sourceWidth =
          video.videoWidth;

        const sourceHeight =
          video.videoHeight;


        const cropWidth =
          Math.floor(
            sourceWidth * 0.90
          );

        const cropHeight =
          Math.floor(
            sourceHeight * 0.30
          );

        const cropX =
          Math.floor(
            (
              sourceWidth -
              cropWidth
            ) / 2
          );

        const cropY =
          Math.floor(
            (
              sourceHeight -
              cropHeight
            ) / 2
          );


        const targetWidth = 1200;


        const scale =
          targetWidth /
          cropWidth;


        const targetHeight =
          Math.max(
            180,
            Math.floor(
              cropHeight * scale
            )
          );


        canvas.width =
          targetWidth;

        canvas.height =
          targetHeight;


        context.drawImage(

          video,

          cropX,
          cropY,
          cropWidth,
          cropHeight,

          0,
          0,
          targetWidth,
          targetHeight

        );


        const imageData =
          context.getImageData(
            0,
            0,
            targetWidth,
            targetHeight
          );


        const results =
          await ZXingWASM
            .readBarcodes(

              imageData,

              {
                formats: ["EAN13"],
                tryHarder: true,
                maxNumberOfSymbols: 1
              }

            );


        if (
          results &&
          results.length > 0
        ) {

          const code =
            normalizeCode(
              results[0].text
            );


          resultElement.textContent =
            code;


          /*
           * 2段目バーコード
           */
          if (
            isSecondBarcode(code)
          ) {

            setMessage(
              "2段目のバーコードを読み取りました。1段目のバーコードを読み直してください。",
              "error"
            );


            manualEntryButton
              .style.display =
              "none";


          /*
           * ISBN
           */
          } else if (
            isIsbn(code)
          ) {

            manualEntryButton
              .style.display =
              "block";


            setMessage(
              "ISBNを読み取りました。",
              "success"
            );


            await stopCamera();

            decoding = false;


            await fetchOpenBd(code);

            return;


          /*
           * 雑誌JANなど
           */
          } else {

            manualEntryButton
              .style.display =
              "block";


            setMessage(
              "書籍のISBNではありません。必要な場合は、下のボタンから手入力してください。",
              "error"
            );
          }
        }


      } catch (error) {

        console.debug(
          "decode:",
          error
        );

      } finally {

        decoding = false;
      }


      requestScan();
    }


    /* =========================================
       ボタン
    ========================================== */

    cameraRetryButton
      .addEventListener(
        "click",
        async function() {

          cameraRetryButton
            .style.display =
            "none";

          await startCamera();

        }
      );


    manualEntryButton
      .addEventListener(
        "click",
        async function() {

          await stopCamera();

          openManualScreen();

        }
      );


    confirmCancelButton
      .addEventListener(
        "click",
        async function() {

          if (saving) {
            return;
          }

          await startCamera();

        }
      );


    /*
     * =========================================
     * OpenBD取得本 → 保存
     * =========================================
     */

    confirmRegisterButton
      .addEventListener(
        "click",
        async function() {

          if (
            saving ||
            !currentBook
          ) {
            return;
          }


          saving = true;


          confirmRegisterButton.disabled =
            true;

          confirmCancelButton.disabled =
            true;


          showResultBox(
            confirmTemporaryResult,
            "登録しています…"
          );


          try {

            await saveBook(
              currentBook
            );


            showResultBox(
              confirmTemporaryResult,
              "登録しました"
            );


            /*
             * 保存成功を確認してから
             * 次の本へ。
             */
            setTimeout(
              async function() {

                saving = false;

                await startCamera();

              },
              900
            );


          } catch (error) {

            console.error(
              "保存エラー:",
              error
            );


            saving = false;


            confirmRegisterButton.disabled =
              false;

            confirmCancelButton.disabled =
              false;


            showResultBox(
              confirmTemporaryResult,
              "登録できませんでした。通信状況を確認して、もう一度お試しください。",
              true
            );
          }
        }
      );


    manualCancelButton
      .addEventListener(
        "click",
        async function() {

          if (saving) {
            return;
          }

          await startCamera();

        }
      );


    /*
     * =========================================
     * 手入力本 → 保存
     * =========================================
     */

    manualRegisterButton
      .addEventListener(
        "click",
        async function() {

          if (saving) {
            return;
          }


          const book =
            getManualBookData();


          /*
           * 書名のみ必須
           */
          if (!book.title) {

            showResultBox(
              manualTemporaryResult,
              "書名を入力してください。",
              true
            );

            manualTitle.focus();

            return;
          }


          /*
           * ISBNは空欄可。
           * 入力された場合だけ形式確認。
           */
          if (
            book.isbn &&
            !isIsbn(book.isbn)
          ) {

            showResultBox(
              manualTemporaryResult,
              "ISBNを入力する場合は、978または979で始まる13桁で入力してください。",
              true
            );

            manualIsbn.focus();

            return;
          }


          saving = true;


          manualRegisterButton.disabled =
            true;

          manualCancelButton.disabled =
            true;


          showResultBox(
            manualTemporaryResult,
            "登録しています…"
          );


          try {

            await saveBook(book);


            showResultBox(
              manualTemporaryResult,
              "登録しました"
            );


            setTimeout(
              async function() {

                saving = false;

                await startCamera();

              },
              900
            );


          } catch (error) {

            console.error(
              "保存エラー:",
              error
            );


            saving = false;


            manualRegisterButton.disabled =
              false;

            manualCancelButton.disabled =
              false;


            showResultBox(
              manualTemporaryResult,
              "登録できませんでした。通信状況を確認して、もう一度お試しください。",
              true
            );
          }
        }
      );


    manualPrice
      .addEventListener(
        "input",
        function() {

          manualPrice.value =
            manualPrice.value
              .replace(/\D/g, "");

        }
      );


    manualIsbn
      .addEventListener(
        "input",
        function() {

          manualIsbn.value =
            manualIsbn.value
              .replace(/\D/g, "")
              .slice(0, 13);

        }
      );


    retryOpenBdButton
      .addEventListener(
        "click",
        async function() {

          if (!currentIsbn) {
            return;
          }

          await fetchOpenBd(
            currentIsbn
          );

        }
      );


    communicationManualButton
      .addEventListener(
        "click",
        function() {

          openManualScreen(
            currentIsbn
          );

        }
      );


    communicationCancelButton
      .addEventListener(
        "click",
        async function() {

          await startCamera();

        }
      );


    /* =========================================
       起動
    ========================================== */

    window.addEventListener(
      "load",
      async function() {

        if (
          typeof ZXingWASM ===
            "undefined" ||
          typeof ZXingWASM
            .readBarcodes !==
            "function"
        ) {

          setMessage(
            "バーコード読み取りプログラムを読み込めませんでした。",
            "error"
          );

          return;
        }


        await startCamera();
      }
    );


    window.addEventListener(
      "pagehide",
      function() {

        clearCameraStartTimer();

        cameraStartGeneration++;

        stopCamera();

      }
    );

  </script>

</body>
</html>
