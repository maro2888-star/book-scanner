<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホde選書 Test10-A</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test10-A</h1>

  <p>
    Cloudflare Worker → D1<br>
    暗号化済みデータ受付テスト
  </p>

  <button id="sendButton">
    テストデータを1件送信
  </button>

  <div id="result">
    まだ送信していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev/";

    document
      .getElementById("sendButton")
      .addEventListener("click", sendTestData);

    async function sendTestData() {
      const button = document.getElementById("sendButton");
      const result = document.getElementById("result");

      button.disabled = true;
      result.textContent = "送信中です...";

      const registrationId =
        "test10a-" +
        Date.now() +
        "-" +
        crypto.randomUUID();

      /*
       * Test10-Aでは、
       * Worker → D1 の保存経路だけを確認します。
       *
       * iv / encryptedKey / ciphertext は
       * 暗号化済みデータに見立てたダミー文字列です。
       *
       * 実際の暗号化処理は後続テストで接続します。
       */
      const testData = {
        registrationId: registrationId,
        eventId: "test10-event-001",
        iv: "TEST10A_DUMMY_IV",
        encryptedKey: "TEST10A_DUMMY_ENCRYPTED_KEY",
        ciphertext: "TEST10A_DUMMY_CIPHERTEXT",
        schemaVersion: "test10a-1"
      };

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(testData)
        });

        const responseText = await response.text();

        let responseData;

        try {
          responseData = JSON.parse(responseText);
        } catch {
          responseData = responseText;
        }

        result.textContent =
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(responseData, null, 2);

      } catch (error) {
        result.textContent =
          "送信エラー\n\n" +
          error.message;

      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
