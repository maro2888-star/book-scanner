<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホde選書 Test11-B</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test11-B</h1>

  <p>
    イベント状態による登録受付制御テスト
  </p>

  <div class="box">
    <p>
      対象イベント：
      <strong>test11-event-001</strong>
    </p>

    <button id="sendButton">
      テスト登録を1件送信
    </button>
  </div>

  <div id="result">
    まだ送信していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev/";

    document
      .getElementById("sendButton")
      .addEventListener("click", sendRegistration);

    async function sendRegistration() {
      const button =
        document.getElementById("sendButton");

      const result =
        document.getElementById("result");

      button.disabled = true;
      result.textContent =
        "送信中です...";

      try {
        const registrationId =
          "test11b-" +
          Date.now() +
          "-" +
          crypto.randomUUID();

        const data = {
          registrationId:
            registrationId,
          eventId:
            "test11-event-001",
          iv:
            "TEST11B_IV",
          encryptedKey:
            "TEST11B_ENCRYPTED_KEY",
          ciphertext:
            "TEST11B_CIPHERTEXT",
          schemaVersion:
            "test11b-1"
        };

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify(data)
            }
          );

        const responseText =
          await response.text();

        let responseData;

        try {
          responseData =
            JSON.parse(responseText);
        } catch {
          responseData =
            responseText;
        }

        result.textContent =
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(
            responseData,
            null,
            2
          ) +
          "\n\n" +
          "registrationId:\n" +
          registrationId;

      } catch (error) {
        result.textContent =
          "送信エラー\n\n" +
          error.message;

      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
