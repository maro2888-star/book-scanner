<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スマホde選書 Test11-C 不正署名テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test11-C</h1>

  <p>
    不正署名によるOPEN拒否テスト
  </p>

  <div class="box">

    <p>
      対象イベント：
      <strong>test11-event-001</strong>
    </p>

    <button id="sendButton">
      別の鍵でOPEN命令を送信する
    </button>

    <p class="note">
      このページでは、司書側とは別の署名用鍵を新しく生成します。
      その秘密鍵でOPEN命令に署名します。
      D1に登録済みの正規公開鍵は変更しません。
    </p>

  </div>

  <div id="result">
    まだ送信していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev";

    const EVENT_ID =
      "test11-event-001";

    document
      .getElementById("sendButton")
      .addEventListener(
        "click",
        sendInvalidOpenCommand
      );


    async function sendInvalidOpenCommand() {

      const button =
        document.getElementById("sendButton");

      const result =
        document.getElementById("result");

      button.disabled = true;

      result.textContent =
        "司書とは別の署名用鍵を生成しています...";

      try {

        const fakeKeyPair =
          await crypto.subtle.generateKey(
            {
              name: "ECDSA",
              namedCurve: "P-256"
            },
            true,
            ["sign", "verify"]
          );

        const timestamp =
          new Date().toISOString();

        const command =
          "OPEN";

        const message =
          EVENT_ID +
          "\n" +
          command +
          "\n" +
          timestamp;

        const signatureBuffer =
          await crypto.subtle.sign(
            {
              name: "ECDSA",
              hash: "SHA-256"
            },
            fakeKeyPair.privateKey,
            new TextEncoder().encode(
              message
            )
          );

        const signature =
          uint8ArrayToBase64Url(
            new Uint8Array(
              signatureBuffer
            )
          );

        result.textContent =
          "別の秘密鍵で署名しました。\n" +
          "OPEN命令を送信しています...";

        const response =
          await fetch(
            WORKER_URL +
            "/test11c/event-command",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  eventId:
                    EVENT_ID,
                  command:
                    command,
                  timestamp:
                    timestamp,
                  signature:
                    signature
                })
            }
          );

        let data;

        try {
          data =
            await response.json();
        } catch {
          data = {
            raw:
              await response.text()
          };
        }

        result.textContent =
          "HTTP Status: " +
          response.status +
          "\n\n" +
          JSON.stringify(
            data,
            null,
            2
          ) +
          "\n\n" +
          (
            response.ok
              ? "【想定外】命令が受理されました。"
              : "不正署名は拒否されました。"
          );

      } catch (error) {

        result.textContent =
          "テストエラー\n\n" +
          error.message;

      } finally {

        button.disabled = false;
      }
    }


    function uint8ArrayToBase64Url(
      bytes
    ) {

      let binary = "";

      for (
        let i = 0;
        i < bytes.length;
        i++
      ) {
        binary +=
          String.fromCharCode(
            bytes[i]
          );
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }
  </script>

</body>
</html>
