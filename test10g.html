<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホde選書 Test10-G</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      cursor: pointer;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>スマホde選書 Test10-G</h1>

  <p>
    保存後・ACK前の中断 → 再開 → 二重保存防止 → ACK
  </p>

  <div class="box">
    <strong>前半</strong>
    <p>
      3件を受付へ保存し、学校側には保存済みと記録します。
      ただしACKはしません。
    </p>

    <button id="phase1Button">
      前半：3件保存してACK前で止める
    </button>
  </div>

  <div class="box">
    <strong>後半</strong>
    <p>
      ページを開き直したあと、同じ3件を再取得し、
      二重保存せずACKします。
    </p>

    <button id="phase2Button">
      後半：再取得して安全にACKする
    </button>
  </div>

  <div class="box">
    <button id="resetButton">
      Test10-Gの状態をリセット
    </button>
  </div>

  <div id="result">
    まだ実行していません。
  </div>

  <script>
    const WORKER_URL =
      "https://sumaho-de-sensho-test10.maro2888.workers.dev/";

    const TEST_STATE_KEY =
      "sumahoDeSenshoTest10GState";

    document
      .getElementById("phase1Button")
      .addEventListener("click", runPhase1);

    document
      .getElementById("phase2Button")
      .addEventListener("click", runPhase2);

    document
      .getElementById("resetButton")
      .addEventListener("click", resetTest);

    showCurrentState();

    async function runPhase1() {
      const result =
        document.getElementById("result");

      try {
        const existing =
          loadState();

        if (existing) {
          result.textContent =
            "Test10-Gの途中データが残っています。\n\n" +
            "新しく始める場合は、先に\n" +
            "「Test10-Gの状態をリセット」\n" +
            "を押してください。";
          return;
        }

        const baseId =
          Date.now() +
          "-" +
          crypto.randomUUID();

        const ids = [
          "test10g-A-" + baseId,
          "test10g-B-" + baseId,
          "test10g-C-" + baseId
        ];

        result.textContent =
          "1. A・B・CをD1へ保存中...";

        for (let i = 0; i < ids.length; i++) {
          await postRegistration(
            ids[i],
            ["A", "B", "C"][i]
          );
        }

        result.textContent +=
          "\n2. 3件を保存しました。";

        result.textContent +=
          "\n3. D1から3件を確認中...";

        const fetched =
          [];

        for (const id of ids) {
          const item =
            await getRegistration(id);

          if (!item) {
            throw new Error(
              "D1から取得できないデータがあります。\n" +
              id
            );
          }

          fetched.push(item);
        }

        result.textContent +=
          "\n4. 3件すべて取得できました。";

        /*
         * 本番ではここが、
         * 学校所有Spreadsheetへの保存
         * ＋ registrationId保存確認に相当。
         *
         * Test10-Gでは localStorage で模擬。
         */
        const state = {
          ids: ids,
          savedRegistrationIds:
            [...ids],
          phase1CompletedAt:
            new Date().toISOString()
        };

        localStorage.setItem(
          TEST_STATE_KEY,
          JSON.stringify(state)
        );

        result.textContent =
          "Test10-G 前半成功\n\n" +

          "D1へ保存：3件\n" +
          "学校側保存済みとして記録：3件\n" +
          "ACK：0件\n\n" +

          "A:\n" +
          ids[0] +
          "\n\n" +

          "B:\n" +
          ids[1] +
          "\n\n" +

          "C:\n" +
          ids[2] +
          "\n\n" +

          "✅ ACKせずに止まりました。\n\n" +

          "ここでこのページを閉じてください。\n" +
          "その後、Test10-Gをもう一度開き、\n" +
          "「後半：再取得して安全にACKする」\n" +
          "を押してください。";

      } catch (error) {
        result.textContent =
          "Test10-G 前半エラー\n\n" +
          error.message;
      }
    }

    async function runPhase2() {
      const result =
        document.getElementById("result");

      try {
        const state =
          loadState();

        if (
          !state ||
          !Array.isArray(state.ids) ||
          state.ids.length !== 3
        ) {
          result.textContent =
            "前半の状態がありません。\n\n" +
            "先に\n" +
            "「前半：3件保存してACK前で止める」\n" +
            "を実行してください。";
          return;
        }

        const ids =
          state.ids;

        const savedIds =
          new Set(
            state.savedRegistrationIds || []
          );

        result.textContent =
          "1. ブラウザ再開後、D1から3件を再取得中...";

        const fetchedAgain =
          [];

        for (const id of ids) {
          const item =
            await getRegistration(id);

          if (!item) {
            throw new Error(
              "再取得できないデータがあります。\n" +
              id
            );
          }

          fetchedAgain.push(item);
        }

        result.textContent +=
          "\n2. 3件すべて再取得できました。";

        let newSaveCount = 0;
        let skippedCount = 0;

        /*
         * 本番のregistrationId重複確認を模擬。
         */
        for (const item of fetchedAgain) {
          if (
            savedIds.has(
              item.registrationId
            )
          ) {
            skippedCount++;
          } else {
            savedIds.add(
              item.registrationId
            );
            newSaveCount++;
          }
        }

        result.textContent +=
          "\n3. 保存済みregistrationIdを確認しました。";

        result.textContent +=
          "\n4. 新規保存：" +
          newSaveCount +
          "件";

        result.textContent +=
          "\n5. 二重保存を回避：" +
          skippedCount +
          "件";

        if (
          newSaveCount !== 0 ||
          skippedCount !== 3
        ) {
          throw new Error(
            "二重保存防止の結果が想定と違います。"
          );
        }

        result.textContent +=
          "\n6. 3件をACK中...";

        for (const id of ids) {
          await ackRegistration(id);
        }

        result.textContent +=
          "\n7. ACK完了。D1残存確認中...";

        let remainingCount = 0;

        for (const id of ids) {
          const item =
            await getRegistration(id);

          if (item !== null) {
            remainingCount++;
          }
        }

        const success =
          newSaveCount === 0 &&
          skippedCount === 3 &&
          remainingCount === 0;

        result.textContent =
          "Test10-G 結果\n\n" +

          "ブラウザ再開後の再取得：3件\n" +
          "新規保存：0件\n" +
          "保存済みとしてスキップ：3件\n" +
          "ACK：3件\n" +
          "ACK後のD1残存："+
          remainingCount +
          "件\n\n" +

          (
            success
              ? "✅ 中断後に同じ3件を再取得しても二重保存せず、安全にACKできました。"
              : "❌ 想定どおりの結果ではありません。"
          );

        if (success) {
          localStorage.removeItem(
            TEST_STATE_KEY
          );
        }

      } catch (error) {
        result.textContent =
          "Test10-G 後半エラー\n\n" +
          error.message;
      }
    }

    async function postRegistration(
      registrationId,
      label
    ) {
      const data = {
        registrationId:
          registrationId,
        eventId:
          "test10-event-001",
        iv:
          "TEST10G_IV_" + label,
        encryptedKey:
          "TEST10G_ENCRYPTED_KEY_" +
          label,
        ciphertext:
          "TEST10G_CIPHERTEXT_" +
          label,
        schemaVersion:
          "test10g-1"
      };

      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(data)
          }
        );

      const responseData =
        await response.json();

      if (
        !response.ok ||
        responseData.ok !== true
      ) {
        throw new Error(
          "保存失敗\n" +
          registrationId +
          "\n" +
          JSON.stringify(
            responseData
          )
        );
      }

      return responseData;
    }

    async function getRegistration(
      registrationId
    ) {
      const response =
        await fetch(
          WORKER_URL +
          "?registrationId=" +
          encodeURIComponent(
            registrationId
          )
        );

      if (response.status === 404) {
        return null;
      }

      const data =
        await response.json();

      if (
        !response.ok ||
        data.ok !== true
      ) {
        throw new Error(
          "取得失敗\n" +
          registrationId +
          "\n" +
          JSON.stringify(data)
        );
      }

      return data.registration;
    }

    async function ackRegistration(
      registrationId
    ) {
      const response =
        await fetch(
          WORKER_URL + "ack",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                registrationId:
                  registrationId
              })
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        data.ok !== true
      ) {
        throw new Error(
          "ACK失敗\n" +
          registrationId +
          "\n" +
          JSON.stringify(data)
        );
      }

      return data;
    }

    function loadState() {
      const raw =
        localStorage.getItem(
          TEST_STATE_KEY
        );

      if (!raw) {
        return null;
      }

      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function resetTest() {
      localStorage.removeItem(
        TEST_STATE_KEY
      );

      document.getElementById(
        "result"
      ).textContent =
        "Test10-Gの状態をリセットしました。";
    }

    function showCurrentState() {
      const state =
        loadState();

      if (state) {
        document.getElementById(
          "result"
        ).textContent =
          "前半の途中状態が残っています。\n\n" +
          "これは正常です。\n" +
          "「後半：再取得して安全にACKする」\n" +
          "を実行できます。";
      }
    }
  </script>

</body>
</html>
